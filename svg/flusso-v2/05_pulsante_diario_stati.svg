<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="leatherBtn" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#3D2914"/>
      <circle cx="5" cy="5" r="1" fill="#2a1f14" opacity="0.3"/>
      <circle cx="15" cy="12" r="1.5" fill="#4D3924" opacity="0.4"/>
    </pattern>
    <filter id="btnShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#1a1510"/>

  <!-- Titolo -->
  <text x="960" y="80" font-family="Georgia, serif" font-size="36" fill="#D4C4A8" text-anchor="middle" font-style="italic">Pulsante Diario - Stati</text>
  <path d="M600,100 Q960,110 1320,100" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.5"/>

  <!-- ========== STATO 1: NORMALE (in gameplay) ========== -->
  <g transform="translate(200, 180)">
    <text x="180" y="0" font-family="Georgia, serif" font-size="24" fill="#D4C4A8" text-anchor="middle" font-style="italic">Normale</text>

    <!-- Simulazione barra inventario -->
    <rect x="0" y="30" width="360" height="60" fill="#2a1f14" opacity="0.8" rx="3"/>

    <!-- Pulsante diario - libro chiuso con rilegatura -->
    <g transform="translate(290, 35)" filter="url(#btnShadow)">
      <!-- Libro chiuso -->
      <rect x="0" y="0" width="50" height="50" fill="#3D2914" rx="3"/>
      <!-- Pagine visibili dal lato -->
      <rect x="5" y="5" width="3" height="40" fill="#D4C4A8" opacity="0.6"/>
      <!-- Decorazione copertina -->
      <path d="M15,10 L40,10 M15,25 L40,25 M15,40 L40,40" stroke="#5C4033" stroke-width="1" opacity="0.5"/>
      <!-- Simbolo antico (cerchio con punto) -->
      <circle cx="27" cy="25" r="10" fill="none" stroke="#8B7355" stroke-width="1.5"/>
      <circle cx="27" cy="25" r="2" fill="#8B7355"/>
    </g>

    <text x="180" y="130" font-family="Georgia, serif" font-size="14" fill="#8a7a6a" text-anchor="middle" font-style="italic">Il diario riposa nella bisaccia</text>
  </g>

  <!-- ========== STATO 2: HOVER ========== -->
  <g transform="translate(650, 180)">
    <text x="180" y="0" font-family="Georgia, serif" font-size="24" fill="#D4C4A8" text-anchor="middle" font-style="italic">Hover</text>

    <rect x="0" y="30" width="360" height="60" fill="#2a1f14" opacity="0.8" rx="3"/>

    <g transform="translate(290, 35)" filter="url(#btnShadow)">
      <!-- Libro con leggero bagliore -->
      <rect x="-2" y="-2" width="54" height="54" fill="#DAA520" opacity="0.2" rx="4"/>
      <rect x="0" y="0" width="50" height="50" fill="#4D3924" rx="3"/>
      <rect x="5" y="5" width="3" height="40" fill="#E8DCC8" opacity="0.7"/>
      <path d="M15,10 L40,10 M15,25 L40,25 M15,40 L40,40" stroke="#6a5a4a" stroke-width="1" opacity="0.6"/>
      <circle cx="27" cy="25" r="10" fill="none" stroke="#DAA520" stroke-width="2"/>
      <circle cx="27" cy="25" r="2" fill="#DAA520"/>
    </g>

    <!-- Tooltip scritto a mano -->
    <g transform="translate(180, 100)">
      <text x="0" y="0" font-family="Georgia, serif" font-size="13" fill="#D4C4A8" text-anchor="middle" font-style="italic">"Apri il diario"</text>
    </g>
  </g>

  <!-- ========== STATO 3: CON NUOVA ANNOTAZIONE ========== -->
  <g transform="translate(1100, 180)">
    <text x="180" y="0" font-family="Georgia, serif" font-size="24" fill="#D4C4A8" text-anchor="middle" font-style="italic">Nuova Annotazione</text>

    <rect x="0" y="30" width="360" height="60" fill="#2a1f14" opacity="0.8" rx="3"/>

    <g transform="translate(290, 35)" filter="url(#btnShadow)">
      <rect x="0" y="0" width="50" height="50" fill="#3D2914" rx="3"/>
      <rect x="5" y="5" width="3" height="40" fill="#D4C4A8" opacity="0.6"/>
      <path d="M15,10 L40,10 M15,25 L40,25 M15,40 L40,40" stroke="#5C4033" stroke-width="1" opacity="0.5"/>
      <circle cx="27" cy="25" r="10" fill="none" stroke="#8B7355" stroke-width="1.5"/>
      <circle cx="27" cy="25" r="2" fill="#8B7355"/>

      <!-- Indicatore: piuma che sporge dal libro -->
      <g transform="translate(40, -15)">
        <path d="M5,30 Q8,15 5,0 Q10,5 12,0 Q9,15 12,30" fill="#DAA520" stroke="#B8860B" stroke-width="0.5"/>
        <!-- Punta della piuma che "pulsa" -->
        <circle cx="8" cy="0" r="3" fill="#DAA520" opacity="0.6">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <text x="180" y="130" font-family="Georgia, serif" font-size="14" fill="#DAA520" text-anchor="middle" font-style="italic">Qualcosa di nuovo da annotare...</text>
  </g>

  <!-- ========== STATO 4: PRESSED ========== -->
  <g transform="translate(1550, 180)">
    <text x="180" y="0" font-family="Georgia, serif" font-size="24" fill="#D4C4A8" text-anchor="middle" font-style="italic">Premuto</text>

    <rect x="0" y="30" width="360" height="60" fill="#2a1f14" opacity="0.8" rx="3"/>

    <g transform="translate(292, 38)">
      <!-- Libro leggermente "premuto" (offset) -->
      <rect x="0" y="0" width="50" height="50" fill="#2D1E0F" rx="3"/>
      <rect x="5" y="5" width="3" height="40" fill="#C4B498" opacity="0.5"/>
      <path d="M15,10 L40,10 M15,25 L40,25 M15,40 L40,40" stroke="#4a3a2a" stroke-width="1" opacity="0.4"/>
      <circle cx="27" cy="25" r="10" fill="none" stroke="#6a5a4a" stroke-width="1.5"/>
      <circle cx="27" cy="25" r="2" fill="#6a5a4a"/>
    </g>
  </g>

  <!-- ========== SEZIONE: INTEGRAZIONE CON INVENTARIO ========== -->
  <g transform="translate(100, 400)">
    <text x="860" y="0" font-family="Georgia, serif" font-size="28" fill="#D4C4A8" text-anchor="middle" font-style="italic">Posizionamento nell'Inventario</text>
    <path d="M400,20 Q860,30 1320,20" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.5"/>

    <!-- Barra inventario completa -->
    <g transform="translate(160, 60)">
      <!-- Sfondo barra -->
      <rect x="0" y="0" width="1400" height="80" fill="#1a1510" stroke="#3D2914" stroke-width="3" rx="5"/>

      <!-- Slot inventario -->
      <g transform="translate(20, 10)">
        <!-- Slot 1 -->
        <rect x="0" y="0" width="60" height="60" fill="#2a1f14" stroke="#4a3a2a" stroke-width="1" rx="3"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#5a4a3a" text-anchor="middle">[vuoto]</text>

        <!-- Slot 2 con oggetto -->
        <rect x="70" y="0" width="60" height="60" fill="#2a1f14" stroke="#4a3a2a" stroke-width="1" rx="3"/>
        <circle cx="100" cy="30" r="20" fill="#4a3a2a"/>
        <text x="100" y="35" font-family="Georgia, serif" font-size="9" fill="#8a7a6a" text-anchor="middle">chiave</text>

        <!-- Slot 3 -->
        <rect x="140" y="0" width="60" height="60" fill="#2a1f14" stroke="#4a3a2a" stroke-width="1" rx="3"/>
        <text x="170" y="35" font-family="Georgia, serif" font-size="10" fill="#5a4a3a" text-anchor="middle">[vuoto]</text>

        <!-- Slot 4 -->
        <rect x="210" y="0" width="60" height="60" fill="#2a1f14" stroke="#4a3a2a" stroke-width="1" rx="3"/>
        <text x="240" y="35" font-family="Georgia, serif" font-size="10" fill="#5a4a3a" text-anchor="middle">[vuoto]</text>

        <!-- ... più slot ... -->
        <text x="320" y="35" font-family="Georgia, serif" font-size="14" fill="#4a3a2a">. . .</text>
      </g>

      <!-- Separatore -->
      <line x1="1200" y1="10" x2="1200" y2="70" stroke="#4a3a2a" stroke-width="2"/>

      <!-- PULSANTE DIARIO (posizione fissa a destra) -->
      <g transform="translate(1230, 10)" filter="url(#btnShadow)">
        <rect x="0" y="0" width="60" height="60" fill="#3D2914" rx="4"/>
        <rect x="6" y="6" width="4" height="48" fill="#D4C4A8" opacity="0.6"/>
        <circle cx="35" cy="30" r="12" fill="none" stroke="#8B7355" stroke-width="2"/>
        <circle cx="35" cy="30" r="3" fill="#8B7355"/>

        <!-- Piuma notifica -->
        <g transform="translate(50, -10)">
          <path d="M5,25 Q8,12 5,0 Q10,4 12,0 Q9,12 12,25" fill="#DAA520" stroke="#B8860B" stroke-width="0.5"/>
        </g>
      </g>

      <!-- Pulsante Menu/Opzioni -->
      <g transform="translate(1320, 10)">
        <rect x="0" y="0" width="60" height="60" fill="#2a1f14" stroke="#4a3a2a" stroke-width="1" rx="4"/>
        <path d="M15,20 L45,20 M15,30 L45,30 M15,40 L45,40" stroke="#6a5a4a" stroke-width="2"/>
      </g>
    </g>

    <!-- Annotazioni -->
    <g transform="translate(1400, 180)">
      <path d="M0,0 L-30,-30" stroke="#6a5a4a" stroke-width="1"/>
      <text x="10" y="5" font-family="Georgia, serif" font-size="13" fill="#8a7a6a" font-style="italic">Diario sempre</text>
      <text x="10" y="22" font-family="Georgia, serif" font-size="13" fill="#8a7a6a" font-style="italic">accessibile</text>
    </g>
  </g>

  <!-- ========== VARIANTI INDICATORE NOTIFICA ========== -->
  <g transform="translate(100, 650)">
    <text x="860" y="0" font-family="Georgia, serif" font-size="28" fill="#D4C4A8" text-anchor="middle" font-style="italic">Indicatori di Nuovi Contenuti</text>
    <path d="M400,20 Q860,30 1320,20" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.5"/>

    <!-- Variante 1: Piuma -->
    <g transform="translate(200, 80)">
      <rect x="0" y="0" width="60" height="60" fill="#3D2914" rx="4" filter="url(#btnShadow)"/>
      <circle cx="30" cy="30" r="12" fill="none" stroke="#8B7355" stroke-width="2"/>
      <circle cx="30" cy="30" r="3" fill="#8B7355"/>
      <g transform="translate(48, -8)">
        <path d="M5,25 Q8,12 5,0 Q10,4 12,0 Q9,12 12,25" fill="#DAA520" stroke="#B8860B" stroke-width="0.5"/>
      </g>
      <text x="30" y="90" font-family="Georgia, serif" font-size="14" fill="#8a7a6a" text-anchor="middle" font-style="italic">Piuma d'oca</text>
      <text x="30" y="108" font-family="Georgia, serif" font-size="12" fill="#6a5a4a" text-anchor="middle">(preferita)</text>
    </g>

    <!-- Variante 2: Sigillo di cera -->
    <g transform="translate(450, 80)">
      <rect x="0" y="0" width="60" height="60" fill="#3D2914" rx="4" filter="url(#btnShadow)"/>
      <circle cx="30" cy="30" r="12" fill="none" stroke="#8B7355" stroke-width="2"/>
      <circle cx="30" cy="30" r="3" fill="#8B7355"/>
      <!-- Sigillo -->
      <g transform="translate(45, -5)">
        <circle cx="10" cy="10" r="10" fill="#8B0000"/>
        <circle cx="10" cy="10" r="6" fill="none" stroke="#5a0000" stroke-width="1"/>
        <text x="10" y="14" font-family="Georgia, serif" font-size="10" fill="#2a0000" text-anchor="middle">!</text>
      </g>
      <text x="30" y="90" font-family="Georgia, serif" font-size="14" fill="#8a7a6a" text-anchor="middle" font-style="italic">Sigillo rosso</text>
    </g>

    <!-- Variante 3: Nastro -->
    <g transform="translate(700, 80)">
      <rect x="0" y="0" width="60" height="60" fill="#3D2914" rx="4" filter="url(#btnShadow)"/>
      <circle cx="30" cy="30" r="12" fill="none" stroke="#8B7355" stroke-width="2"/>
      <circle cx="30" cy="30" r="3" fill="#8B7355"/>
      <!-- Nastro che sporge -->
      <g transform="translate(50, 5)">
        <path d="M0,0 L15,5 L0,10 L5,5 Z" fill="#8B4513"/>
        <path d="M0,15 L15,20 L0,25 L5,20 Z" fill="#8B4513"/>
      </g>
      <text x="30" y="90" font-family="Georgia, serif" font-size="14" fill="#8a7a6a" text-anchor="middle" font-style="italic">Nastri segnalibro</text>
    </g>

    <!-- Variante 4: Bagliore sottile -->
    <g transform="translate(950, 80)">
      <rect x="-3" y="-3" width="66" height="66" fill="#DAA520" opacity="0.3" rx="6">
        <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="60" height="60" fill="#3D2914" rx="4" filter="url(#btnShadow)"/>
      <circle cx="30" cy="30" r="12" fill="none" stroke="#DAA520" stroke-width="2"/>
      <circle cx="30" cy="30" r="3" fill="#DAA520"/>
      <text x="30" y="90" font-family="Georgia, serif" font-size="14" fill="#8a7a6a" text-anchor="middle" font-style="italic">Bagliore dorato</text>
    </g>
  </g>

  <!-- Note finali -->
  <g transform="translate(960, 950)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="16" fill="#6a5a4a" text-anchor="middle" font-style="italic">
      Il pulsante mantiene l'estetica del libro antico, evitando indicatori moderni
    </text>
  </g>

</svg>
