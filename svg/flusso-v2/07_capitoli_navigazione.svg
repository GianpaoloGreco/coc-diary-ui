<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="oldParchment" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#D4C4A8"/>
      <circle cx="30" cy="50" r="15" fill="#C4B498" opacity="0.4"/>
      <circle cx="150" cy="120" r="20" fill="#B4A488" opacity="0.3"/>
      <line x1="0" y1="20" x2="200" y2="22" stroke="#C4B498" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="leatherTexture" patternUnits="userSpaceOnUse" width="50" height="50">
      <rect width="50" height="50" fill="#3D2914"/>
      <circle cx="10" cy="10" r="2" fill="#2a1f14" opacity="0.3"/>
    </pattern>
    <filter id="paperShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#0a0806"/>

  <g id="openBook" filter="url(#paperShadow)">
    <rect x="180" y="50" width="1560" height="980" fill="#3D2914" rx="8"/>
    <rect x="940" y="50" width="40" height="980" fill="#2a1f14"/>

    <!-- ========== PAGINA SINISTRA - INDICE CAPITOLI ========== -->
    <g id="leftPage">
      <path d="M200,70 Q210,65 220,70 L920,70 L925,1010 Q915,1015 905,1010 L220,1015 Q210,1020 200,1010 Z"
            fill="#D4C4A8"/>
      <path d="M200,70 L200,1010" stroke="#8B7355" stroke-width="3" opacity="0.4"/>

      <!-- Titolo -->
      <text x="560" y="120" font-family="Georgia, serif" font-size="32" fill="#2a1f14" text-anchor="middle" font-style="italic">Indice dei Capitoli</text>
      <path d="M300,145 Q560,155 820,145" fill="none" stroke="#6a5a4a" stroke-width="1.5" opacity="0.5"/>

      <!-- Decorazione angolo -->
      <g transform="translate(250, 160)">
        <path d="M0,0 Q20,20 0,40 Q20,20 40,40 Q20,20 40,0 Q20,20 0,0" fill="none" stroke="#5a4a3a" stroke-width="1"/>
      </g>

      <!-- CAPITOLO I - Completato -->
      <g transform="translate(280, 220)">
        <text x="0" y="0" font-family="Georgia, serif" font-size="22" fill="#2a1f14" font-style="italic">I. Il Richiamo</text>
        <text x="400" y="0" font-family="Georgia, serif" font-size="16" fill="#5a4a3a" text-anchor="end">pag. 1</text>
        <path d="M0,10 Q200,15 400,10" fill="none" stroke="#8a7a6a" stroke-width="0.5" stroke-dasharray="3,3"/>
        <!-- Segno di completamento - piccolo fiore/asterisco -->
        <text x="420" y="5" font-family="Georgia, serif" font-size="18" fill="#228B22">*</text>
        <text font-family="Georgia, serif" font-size="13" fill="#5a4a3a" font-style="italic">
          <tspan x="20" dy="30">L'arrivo della lettera misteriosa</tspan>
          <tspan x="20" dy="20">e la partenza verso l'ignoto.</tspan>
        </text>
      </g>

      <!-- CAPITOLO II - Completato -->
      <g transform="translate(280, 350)">
        <text x="0" y="0" font-family="Georgia, serif" font-size="22" fill="#2a1f14" font-style="italic">II. Il Viaggio</text>
        <text x="400" y="0" font-family="Georgia, serif" font-size="16" fill="#5a4a3a" text-anchor="end">pag. 12</text>
        <path d="M0,10 Q200,15 400,10" fill="none" stroke="#8a7a6a" stroke-width="0.5" stroke-dasharray="3,3"/>
        <text x="420" y="5" font-family="Georgia, serif" font-size="18" fill="#228B22">*</text>
        <text font-family="Georgia, serif" font-size="13" fill="#5a4a3a" font-style="italic">
          <tspan x="20" dy="30">Attraverso il mediterraneo,</tspan>
          <tspan x="20" dy="20">presagi inquietanti.</tspan>
        </text>
      </g>

      <!-- CAPITOLO III - Corrente (evidenziato) -->
      <g transform="translate(280, 480)">
        <!-- Bordo evidenziazione -->
        <rect x="-15" y="-25" width="470" height="120" fill="none" stroke="#8B0000" stroke-width="2" rx="5" opacity="0.5"/>
        <text x="0" y="0" font-family="Georgia, serif" font-size="22" fill="#8B0000" font-weight="bold" font-style="italic">III. La Biblioteca</text>
        <text x="400" y="0" font-family="Georgia, serif" font-size="16" fill="#8B0000" text-anchor="end">pag. 24</text>
        <path d="M0,10 Q200,15 400,10" fill="none" stroke="#8B0000" stroke-width="1"/>
        <!-- Indicatore "qui sei" -->
        <g transform="translate(420, -5)">
          <text font-family="Georgia, serif" font-size="12" fill="#8B0000" font-style="italic">← qui</text>
        </g>
        <text font-family="Georgia, serif" font-size="13" fill="#6a4a3a" font-style="italic">
          <tspan x="20" dy="30">La scoperta della macchina</tspan>
          <tspan x="20" dy="20">nelle catacombe di Atene.</tspan>
        </text>
      </g>

      <!-- CAPITOLO IV - Bloccato -->
      <g transform="translate(280, 630)" opacity="0.5">
        <text x="0" y="0" font-family="Georgia, serif" font-size="22" fill="#7a6a5a" font-style="italic">IV. ???</text>
        <text x="400" y="0" font-family="Georgia, serif" font-size="16" fill="#8a7a6a" text-anchor="end">pag. ?</text>
        <path d="M0,10 Q200,15 400,10" fill="none" stroke="#9a8a7a" stroke-width="0.5" stroke-dasharray="3,3"/>
        <text font-family="Georgia, serif" font-size="13" fill="#8a7a6a" font-style="italic">
          <tspan x="20" dy="30">(pagine non ancora scritte)</tspan>
        </text>
      </g>

      <!-- CAPITOLO V - Bloccato -->
      <g transform="translate(280, 750)" opacity="0.4">
        <text x="0" y="0" font-family="Georgia, serif" font-size="22" fill="#8a7a6a" font-style="italic">V. ???</text>
        <text x="400" y="0" font-family="Georgia, serif" font-size="16" fill="#9a8a7a" text-anchor="end">pag. ?</text>
        <path d="M0,10 Q200,15 400,10" fill="none" stroke="#9a8a7a" stroke-width="0.5" stroke-dasharray="3,3"/>
        <text font-family="Georgia, serif" font-size="13" fill="#9a8a7a" font-style="italic">
          <tspan x="20" dy="30">(il futuro è ancora da scrivere)</tspan>
        </text>
      </g>

      <!-- Decorazione fondo -->
      <g transform="translate(530, 900)">
        <path d="M0,0 Q30,15 60,0 Q30,15 60,30 Q30,15 0,30 Q30,15 0,0" fill="none" stroke="#6a5a4a" stroke-width="1"/>
      </g>

      <text x="560" y="990" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle">- Indice -</text>
    </g>

    <!-- ========== PAGINA DESTRA - ANTEPRIMA CAPITOLO ========== -->
    <g id="rightPage">
      <path d="M1000,70 L1700,70 Q1710,75 1720,70 L1720,1010 Q1710,1015 1700,1010 L1000,1015 Z"
            fill="#D4C4A8"/>
      <path d="M1720,70 L1720,1010" stroke="#8B7355" stroke-width="3" opacity="0.4"/>

      <!-- Anteprima del capitolo selezionato -->
      <text x="1360" y="120" font-family="Georgia, serif" font-size="26" fill="#2a1f14" text-anchor="middle" font-style="italic">Capitolo III</text>
      <text x="1360" y="155" font-family="Georgia, serif" font-size="18" fill="#4a3a2a" text-anchor="middle" font-style="italic">La Biblioteca di Atene</text>
      <path d="M1100,175 Q1360,182 1620,175" fill="none" stroke="#6a5a4a" stroke-width="1"/>

      <!-- Mini-mappa del capitolo -->
      <g transform="translate(1080, 210)">
        <rect x="0" y="0" width="560" height="350" fill="#E5D9C3" stroke="#5a4a3a" stroke-width="2" rx="5"/>

        <!-- Rappresentazione schematica delle scene/pagine -->
        <g transform="translate(30, 30)">
          <!-- Scena 1 -->
          <rect x="0" y="0" width="100" height="70" fill="#1a1510" stroke="#4a3a2a" stroke-width="1"/>
          <text x="50" y="45" font-family="Georgia, serif" font-size="10" fill="#6a5a4a" text-anchor="middle">Arrivo</text>
          <circle cx="50" cy="85" r="5" fill="#228B22"/>

          <!-- Scena 2 -->
          <rect x="120" y="0" width="100" height="70" fill="#1a1510" stroke="#4a3a2a" stroke-width="1"/>
          <text x="170" y="45" font-family="Georgia, serif" font-size="10" fill="#6a5a4a" text-anchor="middle">Biblioteca</text>
          <circle cx="170" cy="85" r="5" fill="#228B22"/>

          <!-- Scena 3 (corrente) -->
          <rect x="240" y="0" width="100" height="70" fill="#1a1510" stroke="#8B0000" stroke-width="2"/>
          <text x="290" y="45" font-family="Georgia, serif" font-size="10" fill="#8B0000" text-anchor="middle">Catacombe</text>
          <circle cx="290" cy="85" r="7" fill="#8B0000"/>
          <text x="290" y="110" font-family="Georgia, serif" font-size="9" fill="#8B0000" text-anchor="middle">attuale</text>

          <!-- Scena 4 (futura) -->
          <rect x="360" y="0" width="100" height="70" fill="#2a2520" stroke="#6a5a4a" stroke-width="1" stroke-dasharray="4,2"/>
          <text x="410" y="45" font-family="Georgia, serif" font-size="10" fill="#7a6a5a" text-anchor="middle">?</text>
          <circle cx="410" cy="85" r="5" fill="#6a5a4a" opacity="0.5"/>

          <!-- Linea di connessione -->
          <path d="M55,85 L165,85 L285,85 L405,85" fill="none" stroke="#5a4a3a" stroke-width="1"/>
        </g>

        <!-- Legenda -->
        <g transform="translate(30, 150)">
          <circle cx="10" cy="8" r="5" fill="#228B22"/>
          <text x="25" y="12" font-family="Georgia, serif" font-size="11" fill="#5a4a3a">completato</text>

          <circle cx="120" cy="8" r="6" fill="#8B0000"/>
          <text x="135" y="12" font-family="Georgia, serif" font-size="11" fill="#5a4a3a">attuale</text>

          <circle cx="230" cy="8" r="5" fill="#6a5a4a" opacity="0.5"/>
          <text x="245" y="12" font-family="Georgia, serif" font-size="11" fill="#5a4a3a">da scoprire</text>
        </g>

        <!-- Progresso capitolo -->
        <g transform="translate(30, 200)">
          <text x="0" y="0" font-family="Georgia, serif" font-size="14" fill="#4a3a2a" font-style="italic">Progresso del capitolo:</text>
          <rect x="0" y="15" width="500" height="12" fill="#C4B498" stroke="#8a7a6a" stroke-width="1" rx="3"/>
          <rect x="0" y="15" width="300" height="12" fill="#5a8a3a" rx="3"/>
          <text x="510" y="25" font-family="Georgia, serif" font-size="12" fill="#5a4a3a">60%</text>
        </g>

        <!-- Annotazione -->
        <g transform="translate(30, 270)">
          <text font-family="Georgia, serif" font-size="12" fill="#5a4a3a" font-style="italic">
            <tspan x="0" dy="0">Scoperte: 4/7 indizi</tspan>
            <tspan x="0" dy="18">Personaggi: 3 incontrati</tspan>
            <tspan x="0" dy="18">Luoghi: 2/4 esplorati</tspan>
          </text>
        </g>
      </g>

      <!-- Pulsante "Vai al capitolo" -->
      <g transform="translate(1260, 600)">
        <rect x="0" y="0" width="200" height="50" fill="#3D2914" stroke="#5C4033" stroke-width="2" rx="5"/>
        <text x="100" y="32" font-family="Georgia, serif" font-size="16" fill="#D4C4A8" text-anchor="middle" font-style="italic">Leggi capitolo</text>
      </g>

      <!-- Note sul capitolo -->
      <g transform="translate(1060, 700)">
        <text x="0" y="0" font-family="Georgia, serif" font-size="18" fill="#4a3a2a" font-style="italic">Appunti sul capitolo:</text>
        <text font-family="Georgia, serif" font-size="14" fill="#5a4a3a" font-style="italic">
          <tspan x="20" dy="35">- La macchina è la chiave?</tspan>
          <tspan x="20" dy="25">- Canus nasconde qualcosa</tspan>
          <tspan x="20" dy="25">- I simboli corrispondono a...</tspan>
          <tspan x="20" dy="25" fill="#7a6a5a">(annotazioni del giocatore)</tspan>
        </text>
      </g>

      <!-- Freccia per tornare -->
      <g transform="translate(1080, 920)">
        <path d="M80,15 L0,15 L10,5 M0,15 L10,25" fill="none" stroke="#4a3a2a" stroke-width="2"/>
        <text x="100" y="20" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" font-style="italic">chiudi indice</text>
      </g>

      <text x="1360" y="990" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle">- Anteprima -</text>
    </g>

    <!-- SEGNALIBRI -->
    <g id="bookmarks">
      <g transform="translate(1740, 200)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#8B4513" stroke="#5C3310" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Anime</text>
      </g>
      <g transform="translate(1740, 350)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#2F4F4F" stroke="#1F3F3F" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Luoghi</text>
      </g>
      <g transform="translate(1740, 500)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#4B0082" stroke="#3B0062" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Indizi</text>
      </g>
    </g>

    <!-- Indice capitoli (in alto, cliccabile) -->
    <g transform="translate(200, 30)">
      <text font-family="Georgia, serif" font-size="11" fill="#6a5a4a">
        <tspan x="0" fill="#228B22">I</tspan>
        <tspan x="30" fill="#228B22">II</tspan>
        <tspan x="60" font-weight="bold" fill="#8B0000">III</tspan>
        <tspan x="95" fill="#9a8a7a">IV</tspan>
        <tspan x="125" fill="#9a8a7a">V</tspan>
      </text>
      <!-- Indicatore per "indice aperto" -->
      <rect x="-10" y="-15" width="150" height="30" fill="none" stroke="#DAA520" stroke-width="1" stroke-dasharray="4,2" rx="3"/>
    </g>

    <!-- Chiusura -->
    <g transform="translate(1700, 50)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="18" fill="#3D2914" stroke="#5C4033" stroke-width="1" opacity="0.8"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#8B7355" stroke-width="2"/>
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#8B7355" stroke-width="2"/>
    </g>
  </g>

</svg>
