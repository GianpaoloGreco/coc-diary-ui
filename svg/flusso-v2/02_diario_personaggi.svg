<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="oldParchment" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#D4C4A8"/>
      <circle cx="30" cy="50" r="15" fill="#C4B498" opacity="0.4"/>
      <circle cx="150" cy="120" r="20" fill="#B4A488" opacity="0.3"/>
      <circle cx="80" cy="180" r="12" fill="#C4B498" opacity="0.35"/>
      <line x1="0" y1="20" x2="200" y2="22" stroke="#C4B498" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="100" x2="200" y2="102" stroke="#C4B498" stroke-width="0.4" opacity="0.25"/>
    </pattern>
    <pattern id="leatherTexture" patternUnits="userSpaceOnUse" width="50" height="50">
      <rect width="50" height="50" fill="#3D2914"/>
      <circle cx="10" cy="10" r="2" fill="#2a1f14" opacity="0.3"/>
      <circle cx="35" cy="25" r="3" fill="#4D3924" opacity="0.4"/>
    </pattern>
    <filter id="paperShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#0a0806"/>

  <g id="openBook" filter="url(#paperShadow)">
    <rect x="180" y="50" width="1560" height="980" fill="#3D2914" rx="8"/>
    <rect x="940" y="50" width="40" height="980" fill="#2a1f14"/>

    <!-- ========== PAGINA SINISTRA - RITRATTO PRINCIPALE ========== -->
    <g id="leftPage">
      <path d="M200,70 Q210,65 220,70 L920,70 L925,1010 Q915,1015 905,1010 L220,1015 Q210,1020 200,1010 Z"
            fill="#D4C4A8"/>
      <path d="M200,70 L200,1010" stroke="#8B7355" stroke-width="3" opacity="0.4"/>

      <!-- Titolo sezione -->
      <text x="560" y="110" font-family="Georgia, serif" font-size="28" fill="#2a1f14" text-anchor="middle" font-style="italic">Anime Incontrate</text>
      <path d="M350,125 Q560,135 770,125" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.5"/>

      <!-- RITRATTO GRANDE DI CANUS (disegnato a mano) -->
      <g transform="translate(280, 160)">
        <!-- Cornice irregolare -->
        <path d="M0,5 Q5,-2 15,0 L365,2 Q375,5 380,15 L378,480 Q372,490 360,488 L15,485 Q3,480 0,470 Z"
              fill="none" stroke="#4a3a2a" stroke-width="2"/>

        <!-- Area ritratto -->
        <rect x="15" y="15" width="350" height="455" fill="#1a1510"/>
        <text x="190" y="250" font-family="Georgia, serif" font-size="16" fill="#4a4030" text-anchor="middle" font-style="italic">[Ritratto]</text>
        <text x="190" y="280" font-family="Georgia, serif" font-size="14" fill="#3a3020" text-anchor="middle">Canus</text>
      </g>

      <!-- Nome sotto il ritratto -->
      <text x="470" y="680" font-family="Georgia, serif" font-size="26" fill="#2a1f14" text-anchor="middle" font-style="italic">Canus</text>
      <text x="470" y="710" font-family="Georgia, serif" font-size="16" fill="#4a3a2a" text-anchor="middle">Studioso e compagno di viaggio</text>

      <!-- Descrizione scritta a mano -->
      <g transform="translate(250, 740)">
        <text font-family="Georgia, serif" font-size="15" fill="#3a2a1a" font-style="italic">
          <tspan x="0" dy="0">Un uomo brillante ma dall'animo</tspan>
          <tspan x="0" dy="24">ambiguo. Condividiamo anni di</tspan>
          <tspan x="0" dy="24">ricerche sui testi proibiti, eppure</tspan>
          <tspan x="0" dy="24">non sono mai riuscito a comprendere</tspan>
          <tspan x="0" dy="24">del tutto le sue vere intenzioni.</tspan>
        </text>
      </g>

      <!-- Annotazione a margine -->
      <g transform="translate(210, 200) rotate(-3)">
        <text font-family="Georgia, serif" font-size="12" fill="#5a4a3a" font-style="italic">
          <tspan x="0" dy="0">Primo</tspan>
          <tspan x="0" dy="15">incontro:</tspan>
          <tspan x="0" dy="15">Alessandria</tspan>
        </text>
      </g>

      <text x="560" y="990" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle">- 26 -</text>
    </g>

    <!-- ========== PAGINA DESTRA - ALTRI PERSONAGGI (schizzi) ========== -->
    <g id="rightPage">
      <path d="M1000,70 L1700,70 Q1710,75 1720,70 L1720,1010 Q1710,1015 1700,1010 L1000,1015 Z"
            fill="#D4C4A8"/>
      <path d="M1720,70 L1720,1010" stroke="#8B7355" stroke-width="3" opacity="0.4"/>

      <!-- SCHIZZO 1: Jaad -->
      <g transform="translate(1040, 100)">
        <!-- Ritratto piccolo abbozzato -->
        <ellipse cx="80" cy="70" rx="65" ry="75" fill="none" stroke="#4a3a2a" stroke-width="2"/>
        <circle cx="80" cy="70" r="50" fill="#1a1510"/>
        <text x="80" y="75" font-family="Georgia, serif" font-size="12" fill="#4a4030" text-anchor="middle">[schizzo]</text>

        <!-- Nome e note -->
        <text x="170" y="40" font-family="Georgia, serif" font-size="20" fill="#2a1f14" font-style="italic">Jaad</text>
        <text font-family="Georgia, serif" font-size="14" fill="#4a3a2a" font-style="italic">
          <tspan x="170" y="65">Guida locale.</tspan>
          <tspan x="170" dy="20">Testardo come un mulo,</tspan>
          <tspan x="170" dy="20">ma conosce ogni angolo</tspan>
          <tspan x="170" dy="20">di Kabar.</tspan>
        </text>

        <!-- Piccola nota a margine -->
        <text x="480" y="80" font-family="Georgia, serif" font-size="11" fill="#6a5a4a" font-style="italic" transform="rotate(5)">"fidato?"</text>
      </g>

      <!-- Linea di separazione a mano -->
      <path d="M1060,280 Q1200,275 1340,280 Q1480,285 1680,278" fill="none" stroke="#8a7a6a" stroke-width="1" stroke-dasharray="8,4"/>

      <!-- SCHIZZO 2: Il Mercante -->
      <g transform="translate(1040, 320)">
        <ellipse cx="80" cy="70" rx="65" ry="75" fill="none" stroke="#4a3a2a" stroke-width="2"/>
        <circle cx="80" cy="70" r="50" fill="#1a1510"/>
        <text x="80" y="75" font-family="Georgia, serif" font-size="12" fill="#4a4030" text-anchor="middle">[schizzo]</text>

        <text x="170" y="40" font-family="Georgia, serif" font-size="20" fill="#2a1f14" font-style="italic">Il Mercante</text>
        <text font-family="Georgia, serif" font-size="14" fill="#4a3a2a" font-style="italic">
          <tspan x="170" y="65">Incontrato al bazar.</tspan>
          <tspan x="170" dy="20">Vende oggetti... peculiari.</tspan>
          <tspan x="170" dy="20">Sembra sapere molto più</tspan>
          <tspan x="170" dy="20">di quanto lasci intendere.</tspan>
        </text>

        <!-- Nota di avvertimento -->
        <g transform="translate(400, 120) rotate(-5)">
          <text font-family="Georgia, serif" font-size="13" fill="#8B0000" font-style="italic">
            <tspan x="0" dy="0">ATTENZIONE!</tspan>
            <tspan x="0" dy="16">Non fidarsi.</tspan>
          </text>
        </g>
      </g>

      <!-- Linea -->
      <path d="M1060,500 Q1360,495 1680,502" fill="none" stroke="#8a7a6a" stroke-width="1" stroke-dasharray="8,4"/>

      <!-- SCHIZZO 3: Figura misteriosa (parziale) -->
      <g transform="translate(1040, 540)">
        <ellipse cx="80" cy="70" rx="65" ry="75" fill="none" stroke="#4a3a2a" stroke-width="1.5" stroke-dasharray="5,3"/>
        <circle cx="80" cy="70" r="50" fill="#1a1510" opacity="0.5"/>
        <text x="80" y="70" font-family="Georgia, serif" font-size="24" fill="#5a4a3a" text-anchor="middle">?</text>

        <text x="170" y="50" font-family="Georgia, serif" font-size="18" fill="#5a4a3a" font-style="italic">???</text>
        <text font-family="Georgia, serif" font-size="14" fill="#6a5a4a" font-style="italic">
          <tspan x="170" y="80">Ho visto una figura</tspan>
          <tspan x="170" dy="20">nelle ombre della</tspan>
          <tspan x="170" dy="20">biblioteca. Chi era?</tspan>
          <tspan x="170" dy="20">Mi osservava...</tspan>
        </text>
      </g>

      <!-- Spazio per altri (indicazione) -->
      <g transform="translate(1060, 760)">
        <text font-family="Georgia, serif" font-size="13" fill="#7a6a5a" font-style="italic">
          <tspan x="0" dy="0">(altre pagine seguono)</tspan>
        </text>
        <path d="M0,25 L150,25" fill="none" stroke="#8a7a6a" stroke-width="1"/>
      </g>

      <!-- Freccia per tornare -->
      <g transform="translate(1080, 900)">
        <path d="M80,20 L0,20 L10,10 M0,20 L10,30" fill="none" stroke="#4a3a2a" stroke-width="2"/>
        <text x="100" y="25" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" font-style="italic">alla storia</text>
      </g>

      <text x="1360" y="990" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle">- 27 -</text>
    </g>

    <!-- SEGNALIBRI -->
    <g id="bookmarks">
      <!-- Personaggi (attivo - più evidente) -->
      <g transform="translate(1740, 200)">
        <path d="M0,0 L70,0 L70,90 L35,70 L0,90 Z" fill="#8B4513" stroke="#DAA520" stroke-width="2"/>
        <text x="35" y="40" font-family="Georgia, serif" font-size="11" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 35, 40)">Anime</text>
      </g>
      <g transform="translate(1740, 350)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#2F4F4F" stroke="#1F3F3F" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Luoghi</text>
      </g>
      <g transform="translate(1740, 500)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#4B0082" stroke="#3B0062" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Indizi</text>
      </g>
    </g>

    <!-- Indice capitoli -->
    <g transform="translate(200, 30)">
      <text font-family="Georgia, serif" font-size="11" fill="#6a5a4a">
        <tspan x="0">I</tspan>
        <tspan x="30">II</tspan>
        <tspan x="60" font-weight="bold" fill="#2a1f14">III</tspan>
        <tspan x="95" fill="#9a8a7a">IV</tspan>
        <tspan x="125" fill="#9a8a7a">V</tspan>
      </text>
    </g>

    <!-- Chiusura -->
    <g transform="translate(1700, 50)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="18" fill="#3D2914" stroke="#5C4033" stroke-width="1" opacity="0.8"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#8B7355" stroke-width="2"/>
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#8B7355" stroke-width="2"/>
    </g>
  </g>

</svg>