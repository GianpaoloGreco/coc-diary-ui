<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Texture pergamena invecchiata -->
    <pattern id="oldParchment" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#D4C4A8"/>
      <!-- Macchie e imperfezioni -->
      <circle cx="30" cy="50" r="15" fill="#C4B498" opacity="0.4"/>
      <circle cx="150" cy="120" r="20" fill="#B4A488" opacity="0.3"/>
      <circle cx="80" cy="180" r="12" fill="#C4B498" opacity="0.35"/>
      <ellipse cx="170" cy="40" rx="25" ry="15" fill="#C4B498" opacity="0.25"/>
      <!-- Fibre -->
      <line x1="0" y1="20" x2="200" y2="22" stroke="#C4B498" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="60" x2="200" y2="58" stroke="#B4A488" stroke-width="0.3" opacity="0.2"/>
      <line x1="0" y1="100" x2="200" y2="102" stroke="#C4B498" stroke-width="0.4" opacity="0.25"/>
      <line x1="0" y1="140" x2="200" y2="138" stroke="#B4A488" stroke-width="0.3" opacity="0.2"/>
    </pattern>

    <!-- Gradiente bordi bruciati/invecchiati -->
    <linearGradient id="edgeWear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:0.6"/>
      <stop offset="5%" style="stop-color:#D4C4A8;stop-opacity:0"/>
      <stop offset="95%" style="stop-color:#D4C4A8;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:0.6"/>
    </linearGradient>

    <!-- Copertina in pelle usurata -->
    <pattern id="leatherTexture" patternUnits="userSpaceOnUse" width="50" height="50">
      <rect width="50" height="50" fill="#3D2914"/>
      <circle cx="10" cy="10" r="2" fill="#2a1f14" opacity="0.3"/>
      <circle cx="35" cy="25" r="3" fill="#4D3924" opacity="0.4"/>
      <circle cx="20" cy="40" r="2" fill="#2a1f14" opacity="0.3"/>
    </pattern>

    <filter id="paperShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Macchia d'inchiostro -->
    <filter id="inkBlot">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>

  <!-- Sfondo scuro -->
  <rect width="1920" height="1080" fill="#0a0806"/>

  <!-- ========== LIBRO APERTO ========== -->
  <g id="openBook" filter="url(#paperShadow)">

    <!-- Copertina/dorso visibile -->
    <rect x="180" y="50" width="1560" height="980" fill="#3D2914" rx="8"/>

    <!-- Rilegatura centrale -->
    <rect x="940" y="50" width="40" height="980" fill="#2a1f14"/>
    <path d="M945,70 Q960,540 945,1010" fill="none" stroke="#1a0f0a" stroke-width="3"/>
    <path d="M975,70 Q960,540 975,1010" fill="none" stroke="#1a0f0a" stroke-width="3"/>

    <!-- ========== PAGINA SINISTRA ========== -->
    <g id="leftPage">
      <!-- Pagina base con bordi irregolari -->
      <path d="M200,70
               Q210,65 220,70 L900,70
               Q905,75 910,70 L920,70
               L925,1010
               Q915,1015 905,1010 L220,1015
               Q210,1020 200,1010
               Z"
            fill="#D4C4A8"/>

      <!-- Bordi usurati -->
      <path d="M200,70 L200,1010" stroke="#8B7355" stroke-width="3" opacity="0.4"/>

      <!-- Macchie d'inchiostro sparse -->
      <circle cx="280" cy="150" r="8" fill="#2a1f14" opacity="0.15"/>
      <ellipse cx="850" cy="900" rx="12" ry="8" fill="#2a1f14" opacity="0.1"/>
      <circle cx="400" cy="800" r="5" fill="#2a1f14" opacity="0.12"/>

      <!-- INTESTAZIONE CAPITOLO (scritto a mano) -->
      <text x="560" y="130" font-family="Georgia, serif" font-size="42" fill="#2a1f14" text-anchor="middle"
            style="font-style: italic;">Capitolo III</text>
      <text x="560" y="175" font-family="Georgia, serif" font-size="22" fill="#4a3a2a" text-anchor="middle"
            style="font-style: italic;">La Biblioteca di Atene</text>

      <!-- Linea decorativa a mano -->
      <path d="M300,195 Q430,190 560,195 Q690,200 820,195" fill="none" stroke="#6a5a4a" stroke-width="1.5" opacity="0.6"/>

      <!-- AREA IMMAGINE (Motion Comic) con bordo disegnato a mano -->
      <g transform="translate(250, 230)">
        <!-- Cornice irregolare disegnata a mano -->
        <path d="M0,5 Q2,0 10,2 L610,0 Q618,3 620,10 L622,420 Q618,428 610,430 L10,432 Q2,428 0,420 Z"
              fill="#1a1a1a" stroke="#4a3a2a" stroke-width="2"/>
        <path d="M5,10 L615,8 L617,422 L8,425 Z" fill="#0f1a1a"/>

        <!-- Placeholder immagine -->
        <text x="310" y="220" font-family="Georgia, serif" font-size="18" fill="#3a4a4a" text-anchor="middle" font-style="italic">[Illustrazione]</text>
      </g>

      <!-- Didascalia scritta a mano sotto l'immagine -->
      <text x="560" y="700" font-family="Georgia, serif" font-size="16" fill="#4a3a2a" text-anchor="middle" font-style="italic">
        "La macchina che non dovrebbe esistere"
      </text>

      <!-- Annotazione a margine sinistro (nota di Rabian) -->
      <g transform="translate(210, 750) rotate(-2)">
        <text font-family="Georgia, serif" font-size="13" fill="#5a4a3a" font-style="italic">
          <tspan x="0" dy="0">* I simboli sulla</tspan>
          <tspan x="0" dy="18">macchina sono simili</tspan>
          <tspan x="0" dy="18">a quelli del</tspan>
          <tspan x="0" dy="18">Necronomicon...</tspan>
        </text>
      </g>

      <!-- Piccolo schizzo a margine -->
      <g transform="translate(220, 880)">
        <circle cx="30" cy="30" r="25" fill="none" stroke="#4a3a2a" stroke-width="1.5"/>
        <path d="M20,20 L40,40 M40,20 L20,40" stroke="#4a3a2a" stroke-width="1"/>
        <text x="30" y="75" font-family="Georgia, serif" font-size="10" fill="#5a4a3a" text-anchor="middle" font-style="italic">simbolo?</text>
      </g>

      <!-- Numero pagina -->
      <text x="560" y="990" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle">- 24 -</text>
    </g>

    <!-- ========== PAGINA DESTRA ========== -->
    <g id="rightPage">
      <!-- Pagina con bordi irregolari -->
      <path d="M1000,70
               L1700,70 Q1710,75 1720,70
               L1720,1010 Q1710,1015 1700,1010
               L1000,1015 Q995,1010 1000,1005
               Z"
            fill="#D4C4A8"/>

      <!-- Bordo destro usurato -->
      <path d="M1720,70 L1720,1010" stroke="#8B7355" stroke-width="3" opacity="0.4"/>

      <!-- Macchie -->
      <circle cx="1100" cy="200" r="6" fill="#2a1f14" opacity="0.1"/>
      <ellipse cx="1650" cy="600" rx="10" ry="6" fill="#2a1f14" opacity="0.08"/>

      <!-- TESTO NARRATIVO (scritto a mano) -->
      <g transform="translate(1040, 100)">
        <text font-family="Georgia, serif" font-size="18" fill="#2a1f14" style="font-style: italic;">
          <tspan x="0" dy="30">Il viaggio verso Atene fu lungo e pieno</tspan>
          <tspan x="0" dy="32">di presagi inquietanti. Durante la</tspan>
          <tspan x="0" dy="32">traversata, i marinai parlavano</tspan>
          <tspan x="0" dy="32">sottovoce di strane luci viste</tspan>
          <tspan x="0" dy="32">all'orizzonte nelle notti senza luna.</tspan>
          <tspan x="0" dy="48">"Qualcosa non va in questo luogo"</tspan>
          <tspan x="0" dy="32">mormorò Canus guardandosi intorno</tspan>
          <tspan x="0" dy="32">con circospezione.</tspan>
          <tspan x="0" dy="48">Arrivato finalmente alla Grande</tspan>
          <tspan x="0" dy="32">Biblioteca, fui colpito dalla magnificenza</tspan>
          <tspan x="0" dy="32">degli antichi scaffali. Ma qualcosa non</tspan>
          <tspan x="0" dy="32">andava. I custodi sembravano nervosi,</tspan>
          <tspan x="0" dy="32">e certi tomi erano stati rimossi dalle</tspan>
          <tspan x="0" dy="32">loro postazioni...</tspan>
          <tspan x="0" dy="48">Fu allora che scoprii la macchina.</tspan>
          <tspan x="0" dy="32">Un congegno che sfidava ogni logica,</tspan>
          <tspan x="0" dy="32">nascosto nelle catacombe sotto la</tspan>
          <tspan x="0" dy="32">biblioteca stessa. Un meccanismo che</tspan>
          <tspan x="0" dy="32">non apparteneva a questa era...</tspan>
          <tspan x="0" dy="32">forse a nessuna era umana.</tspan>
        </text>
      </g>

      <!-- Annotazione a margine destro -->
      <g transform="translate(1620, 300) rotate(3)">
        <text font-family="Georgia, serif" font-size="12" fill="#5a4a3a" font-style="italic">
          <tspan x="0" dy="0">Canus sa</tspan>
          <tspan x="0" dy="16">qualcosa</tspan>
          <tspan x="0" dy="16">che non</tspan>
          <tspan x="0" dy="16">dice?</tspan>
        </text>
      </g>

      <!-- Freccia di continuazione disegnata -->
      <g transform="translate(1550, 880)">
        <path d="M0,20 L80,20 L70,10 M80,20 L70,30" fill="none" stroke="#4a3a2a" stroke-width="2"/>
        <text x="40" y="50" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" text-anchor="middle" font-style="italic">continua</text>
      </g>

      <!-- Numero pagina -->
      <text x="1360" y="990" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle">- 25 -</text>
    </g>

    <!-- ========== SEGNALIBRI (invece dei tab moderni) ========== -->
    <g id="bookmarks">
      <!-- Segnalibro Personaggi (stoffa che sporge) -->
      <g transform="translate(1740, 200)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#8B4513" stroke="#5C3310" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Anime</text>
      </g>

      <!-- Segnalibro Luoghi -->
      <g transform="translate(1740, 350)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#2F4F4F" stroke="#1F3F3F" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Luoghi</text>
      </g>

      <!-- Segnalibro Indizi -->
      <g transform="translate(1740, 500)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#4B0082" stroke="#3B0062" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Indizi</text>
      </g>
    </g>

    <!-- ========== INDICE CAPITOLI (piccolo, discreto in alto) ========== -->
    <g transform="translate(200, 30)">
      <text font-family="Georgia, serif" font-size="11" fill="#6a5a4a">
        <tspan x="0">I</tspan>
        <tspan x="30">II</tspan>
        <tspan x="60" font-weight="bold" fill="#2a1f14">III</tspan>
        <tspan x="95" fill="#9a8a7a">IV</tspan>
        <tspan x="125" fill="#9a8a7a">V</tspan>
      </text>
    </g>

    <!-- ========== CHIUSURA (piccola X discreta) ========== -->
    <g id="closeButton" transform="translate(1700, 50)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="18" fill="#3D2914" stroke="#5C4033" stroke-width="1" opacity="0.8"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#8B7355" stroke-width="2"/>
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#8B7355" stroke-width="2"/>
    </g>

  </g>

</svg>