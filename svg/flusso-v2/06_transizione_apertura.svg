<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="oldParchment" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#D4C4A8"/>
      <circle cx="30" cy="50" r="15" fill="#C4B498" opacity="0.4"/>
      <circle cx="150" cy="120" r="20" fill="#B4A488" opacity="0.3"/>
    </pattern>
    <pattern id="leatherTexture" patternUnits="userSpaceOnUse" width="50" height="50">
      <rect width="50" height="50" fill="#3D2914"/>
      <circle cx="10" cy="10" r="2" fill="#2a1f14" opacity="0.3"/>
    </pattern>
    <filter id="paperShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#1a1510"/>

  <!-- Titolo -->
  <text x="960" y="50" font-family="Georgia, serif" font-size="32" fill="#D4C4A8" text-anchor="middle" font-style="italic">Transizione Apertura Diario</text>
  <path d="M600,70 Q960,78 1320,70" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.5"/>

  <!-- ========== FRAME 1: Libro chiuso ========== -->
  <g transform="translate(80, 120)">
    <text x="160" y="0" font-family="Georgia, serif" font-size="18" fill="#8a7a6a" text-anchor="middle">Frame 1</text>
    <text x="160" y="22" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle" font-style="italic">Libro chiuso</text>

    <!-- Libro chiuso (scala ridotta) -->
    <g transform="translate(60, 50) scale(0.3)" filter="url(#paperShadow)">
      <rect x="0" y="0" width="340" height="450" fill="#3D2914" rx="5"/>
      <!-- Pagine visibili -->
      <rect x="10" y="20" width="8" height="410" fill="#D4C4A8" opacity="0.5"/>
      <!-- Decorazione -->
      <rect x="50" y="80" width="240" height="300" fill="none" stroke="#5C4033" stroke-width="3"/>
      <circle cx="170" cy="230" r="60" fill="none" stroke="#8B7355" stroke-width="4"/>
      <circle cx="170" cy="230" r="15" fill="#8B7355"/>
      <!-- Rilegatura -->
      <rect x="15" y="0" width="25" height="450" fill="#2a1f14"/>
    </g>
  </g>

  <!-- Freccia -->
  <g transform="translate(290, 280)">
    <path d="M0,0 L40,0 L35,-8 M40,0 L35,8" fill="none" stroke="#6a5a4a" stroke-width="2"/>
  </g>

  <!-- ========== FRAME 2: Copertina si solleva ========== -->
  <g transform="translate(350, 120)">
    <text x="160" y="0" font-family="Georgia, serif" font-size="18" fill="#8a7a6a" text-anchor="middle">Frame 2</text>
    <text x="160" y="22" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle" font-style="italic">Copertina si solleva</text>

    <g transform="translate(40, 50) scale(0.3)" filter="url(#paperShadow)">
      <!-- Pagine sottostanti -->
      <rect x="40" y="10" width="300" height="440" fill="#D4C4A8" rx="3"/>

      <!-- Copertina che si apre (inclinata) -->
      <g transform="translate(40, 0)">
        <path d="M0,10 L-80,30 L-80,420 L0,440 Z" fill="#3D2914"/>
        <rect x="-75" y="40" width="60" height="350" fill="none" stroke="#5C4033" stroke-width="2" transform="skewY(-3)"/>
      </g>

      <!-- Rilegatura -->
      <rect x="35" y="0" width="15" height="450" fill="#2a1f14"/>
    </g>
  </g>

  <!-- Freccia -->
  <g transform="translate(560, 280)">
    <path d="M0,0 L40,0 L35,-8 M40,0 L35,8" fill="none" stroke="#6a5a4a" stroke-width="2"/>
  </g>

  <!-- ========== FRAME 3: Libro semi-aperto ========== -->
  <g transform="translate(620, 120)">
    <text x="180" y="0" font-family="Georgia, serif" font-size="18" fill="#8a7a6a" text-anchor="middle">Frame 3</text>
    <text x="180" y="22" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle" font-style="italic">Libro semi-aperto</text>

    <g transform="translate(30, 50) scale(0.28)" filter="url(#paperShadow)">
      <!-- Pagina destra -->
      <path d="M350,20 L650,30 L650,430 L350,440 Z" fill="#D4C4A8"/>

      <!-- Pagina sinistra -->
      <path d="M350,20 L50,30 L50,430 L350,440 Z" fill="#D4C4A8"/>

      <!-- Copertina sinistra aperta -->
      <path d="M50,20 L-100,0 L-100,450 L50,440 Z" fill="#3D2914"/>

      <!-- Rilegatura centrale -->
      <rect x="340" y="10" width="20" height="440" fill="#2a1f14"/>

      <!-- Testo che appare sfocato -->
      <g opacity="0.3">
        <line x1="80" y1="80" x2="300" y2="80" stroke="#4a3a2a" stroke-width="3"/>
        <line x1="80" y1="120" x2="280" y2="120" stroke="#4a3a2a" stroke-width="2"/>
        <line x1="80" y1="150" x2="290" y2="150" stroke="#4a3a2a" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- Freccia -->
  <g transform="translate(860, 280)">
    <path d="M0,0 L40,0 L35,-8 M40,0 L35,8" fill="none" stroke="#6a5a4a" stroke-width="2"/>
  </g>

  <!-- ========== FRAME 4: Libro aperto (finale) ========== -->
  <g transform="translate(920, 120)">
    <text x="220" y="0" font-family="Georgia, serif" font-size="18" fill="#8a7a6a" text-anchor="middle">Frame 4</text>
    <text x="220" y="22" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle" font-style="italic">Libro completamente aperto</text>

    <g transform="translate(0, 40) scale(0.25)" filter="url(#paperShadow)">
      <!-- Copertina/dorso -->
      <rect x="100" y="0" width="1560" height="500" fill="#3D2914" rx="5"/>
      <rect x="860" y="0" width="30" height="500" fill="#2a1f14"/>

      <!-- Pagina sinistra -->
      <path d="M120,15 L850,15 L855,485 L125,490 Z" fill="#D4C4A8"/>

      <!-- Pagina destra -->
      <path d="M900,15 L1640,15 L1645,485 L905,490 Z" fill="#D4C4A8"/>

      <!-- Contenuto pagina sinistra -->
      <text x="490" y="60" font-family="Georgia, serif" font-size="28" fill="#2a1f14" text-anchor="middle" font-style="italic">Capitolo III</text>
      <rect x="200" y="100" width="500" height="300" fill="#1a1510" stroke="#4a3a2a" stroke-width="2"/>
      <text x="450" y="260" font-family="Georgia, serif" font-size="14" fill="#4a4030" text-anchor="middle">[Illustrazione]</text>

      <!-- Contenuto pagina destra -->
      <g transform="translate(940, 50)">
        <line x1="0" y1="0" x2="600" y2="0" stroke="#3a2a1a" stroke-width="2"/>
        <line x1="0" y1="35" x2="580" y2="35" stroke="#3a2a1a" stroke-width="2"/>
        <line x1="0" y1="70" x2="560" y2="70" stroke="#3a2a1a" stroke-width="2"/>
        <line x1="0" y1="105" x2="590" y2="105" stroke="#3a2a1a" stroke-width="2"/>
        <line x1="0" y1="140" x2="550" y2="140" stroke="#3a2a1a" stroke-width="2"/>
      </g>

      <!-- Segnalibri -->
      <g transform="translate(1660, 100)">
        <path d="M0,0 L40,0 L40,60 L20,45 L0,60 Z" fill="#8B4513"/>
      </g>
      <g transform="translate(1660, 200)">
        <path d="M0,0 L40,0 L40,60 L20,45 L0,60 Z" fill="#2F4F4F"/>
      </g>
    </g>
  </g>

  <!-- ========== SEZIONE: Timeline animazione ========== -->
  <g transform="translate(100, 580)">
    <text x="860" y="0" font-family="Georgia, serif" font-size="24" fill="#D4C4A8" text-anchor="middle" font-style="italic">Timeline Animazione</text>

    <!-- Linea temporale -->
    <line x1="100" y1="60" x2="1620" y2="60" stroke="#4a3a2a" stroke-width="3"/>

    <!-- Marker -->
    <g transform="translate(100, 60)">
      <circle cx="0" cy="0" r="8" fill="#8B4513"/>
      <text x="0" y="30" font-family="Georgia, serif" font-size="12" fill="#8a7a6a" text-anchor="middle">0ms</text>
      <text x="0" y="48" font-family="Georgia, serif" font-size="11" fill="#6a5a4a" text-anchor="middle" font-style="italic">Click</text>
    </g>

    <g transform="translate(500, 60)">
      <circle cx="0" cy="0" r="8" fill="#8B4513"/>
      <text x="0" y="30" font-family="Georgia, serif" font-size="12" fill="#8a7a6a" text-anchor="middle">150ms</text>
      <text x="0" y="48" font-family="Georgia, serif" font-size="11" fill="#6a5a4a" text-anchor="middle" font-style="italic">Copertina si alza</text>
    </g>

    <g transform="translate(900, 60)">
      <circle cx="0" cy="0" r="8" fill="#8B4513"/>
      <text x="0" y="30" font-family="Georgia, serif" font-size="12" fill="#8a7a6a" text-anchor="middle">350ms</text>
      <text x="0" y="48" font-family="Georgia, serif" font-size="11" fill="#6a5a4a" text-anchor="middle" font-style="italic">Pagine si aprono</text>
    </g>

    <g transform="translate(1300, 60)">
      <circle cx="0" cy="0" r="8" fill="#8B4513"/>
      <text x="0" y="30" font-family="Georgia, serif" font-size="12" fill="#8a7a6a" text-anchor="middle">500ms</text>
      <text x="0" y="48" font-family="Georgia, serif" font-size="11" fill="#6a5a4a" text-anchor="middle" font-style="italic">Espansione a schermo</text>
    </g>

    <g transform="translate(1620, 60)">
      <circle cx="0" cy="0" r="8" fill="#DAA520"/>
      <text x="0" y="30" font-family="Georgia, serif" font-size="12" fill="#DAA520" text-anchor="middle">600ms</text>
      <text x="0" y="48" font-family="Georgia, serif" font-size="11" fill="#DAA520" text-anchor="middle" font-style="italic">Completo</text>
    </g>
  </g>

  <!-- ========== SEZIONE: Note tecniche ========== -->
  <g transform="translate(100, 750)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="20" fill="#D4C4A8" font-style="italic">Note per l'implementazione:</text>

    <text font-family="Georgia, serif" font-size="15" fill="#8a7a6a" font-style="italic">
      <tspan x="30" dy="40">- Easing: ease-out per movimento naturale della carta</tspan>
      <tspan x="30" dy="28">- Il suono di pagine che frusciano accompagna l'apertura</tspan>
      <tspan x="30" dy="28">- Leggera ombra che si espande man mano che il libro si apre</tspan>
      <tspan x="30" dy="28">- Lo sfondo si oscura gradualmente (fade to black al 70%)</tspan>
      <tspan x="30" dy="28">- Il contenuto delle pagine appare con fade-in negli ultimi 100ms</tspan>
    </text>
  </g>

  <!-- ========== CHIUSURA (inverso) ========== -->
  <g transform="translate(960, 920)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="18" fill="#6a5a4a" text-anchor="middle" font-style="italic">
      La chiusura segue la sequenza inversa (600ms → 0ms)
    </text>
    <text x="0" y="25" font-family="Georgia, serif" font-size="14" fill="#5a4a3a" text-anchor="middle">
      Click sulla X o pressione ESC
    </text>
  </g>

</svg>
