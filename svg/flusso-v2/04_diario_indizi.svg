<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="oldParchment" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#D4C4A8"/>
      <circle cx="30" cy="50" r="15" fill="#C4B498" opacity="0.4"/>
      <circle cx="150" cy="120" r="20" fill="#B4A488" opacity="0.3"/>
      <line x1="0" y1="20" x2="200" y2="22" stroke="#C4B498" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="leatherTexture" patternUnits="userSpaceOnUse" width="50" height="50">
      <rect width="50" height="50" fill="#3D2914"/>
      <circle cx="10" cy="10" r="2" fill="#2a1f14" opacity="0.3"/>
    </pattern>
    <filter id="paperShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#0a0806"/>

  <g id="openBook" filter="url(#paperShadow)">
    <rect x="180" y="50" width="1560" height="980" fill="#3D2914" rx="8"/>
    <rect x="940" y="50" width="40" height="980" fill="#2a1f14"/>

    <!-- ========== PAGINA SINISTRA - INDIZI PRINCIPALI ========== -->
    <g id="leftPage">
      <path d="M200,70 Q210,65 220,70 L920,70 L925,1010 Q915,1015 905,1010 L220,1015 Q210,1020 200,1010 Z"
            fill="#D4C4A8"/>
      <path d="M200,70 L200,1010" stroke="#8B7355" stroke-width="3" opacity="0.4"/>

      <!-- Titolo -->
      <text x="560" y="100" font-family="Georgia, serif" font-size="26" fill="#2a1f14" text-anchor="middle" font-style="italic">Indizi e Annotazioni</text>
      <path d="M320,115 Q560,122 800,115" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.5"/>

      <!-- INDIZIO 1: La Statuetta -->
      <g transform="translate(230, 150)">
        <!-- Schizzo dell'oggetto -->
        <g transform="translate(0, 0)">
          <ellipse cx="60" cy="80" rx="55" ry="70" fill="none" stroke="#3a2a1a" stroke-width="2"/>
          <path d="M40,50 Q60,30 80,50 L75,110 Q60,120 45,110 Z" fill="none" stroke="#3a2a1a" stroke-width="1.5"/>
          <!-- Tentacoli stilizzati -->
          <path d="M45,50 Q30,40 25,55" fill="none" stroke="#3a2a1a" stroke-width="1"/>
          <path d="M75,50 Q90,40 95,55" fill="none" stroke="#3a2a1a" stroke-width="1"/>
          <path d="M50,45 Q45,30 55,25" fill="none" stroke="#3a2a1a" stroke-width="1"/>
          <path d="M70,45 Q75,30 65,25" fill="none" stroke="#3a2a1a" stroke-width="1"/>
        </g>

        <!-- Descrizione -->
        <g transform="translate(140, 10)">
          <text font-family="Georgia, serif" font-size="20" fill="#2a1f14" font-style="italic">La Statuetta</text>
          <text font-family="Georgia, serif" font-size="14" fill="#4a3a2a" font-style="italic">
            <tspan x="0" y="35">Pietra verde scuro. Corpo</tspan>
            <tspan x="0" dy="22">antropoide, testa cefalopode.</tspan>
            <tspan x="0" dy="22">Mio padre me la consegnò</tspan>
            <tspan x="0" dy="22">prima di scomparire.</tspan>
            <tspan x="0" dy="35" fill="#8B0000">"Una scelta difficile"</tspan>
            <tspan x="0" dy="22" fill="#8B0000">furono le sue ultime parole.</tspan>
          </text>
        </g>

        <!-- Nota urgente a margine -->
        <g transform="translate(480, 40) rotate(5)">
          <text font-family="Georgia, serif" font-size="13" fill="#8B0000" font-style="italic">
            <tspan x="0" dy="0">IMPORTANTE!</tspan>
            <tspan x="0" dy="18">A volte sembra</tspan>
            <tspan x="0" dy="18">pulsare...</tspan>
          </text>
        </g>
      </g>

      <!-- Linea separatrice a mano -->
      <path d="M250,380 Q450,375 660,382 Q750,385 870,378" fill="none" stroke="#7a6a5a" stroke-width="1"/>

      <!-- INDIZIO 2: La Pergamena -->
      <g transform="translate(230, 410)">
        <!-- Schizzo pergamena arrotolata -->
        <g transform="translate(0, 10)">
          <rect x="10" y="20" width="90" height="120" fill="none" stroke="#4a3a2a" stroke-width="1.5" transform="rotate(-5)"/>
          <ellipse cx="15" cy="80" rx="8" ry="60" fill="none" stroke="#4a3a2a" stroke-width="1.5"/>
          <!-- Righe di testo stilizzate -->
          <line x1="25" y1="40" x2="85" y2="38" stroke="#6a5a4a" stroke-width="1"/>
          <line x1="25" y1="55" x2="80" y2="53" stroke="#6a5a4a" stroke-width="1"/>
          <line x1="25" y1="70" x2="75" y2="68" stroke="#6a5a4a" stroke-width="1"/>
          <line x1="25" y1="85" x2="82" y2="83" stroke="#6a5a4a" stroke-width="1"/>
        </g>

        <g transform="translate(130, 0)">
          <text font-family="Georgia, serif" font-size="18" fill="#2a1f14" font-style="italic">Pergamena del Custode</text>
          <text font-family="Georgia, serif" font-size="14" fill="#4a3a2a" font-style="italic">
            <tspan x="0" y="30">Trovata nella biblioteca.</tspan>
            <tspan x="0" dy="22">Menziona "i portali" e</tspan>
            <tspan x="0" dy="22">"la chiave tra i mondi".</tspan>
            <tspan x="0" dy="22">Scritta in aramaico antico.</tspan>
          </text>
        </g>

        <!-- Nota -->
        <text x="500" y="100" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" font-style="italic" transform="rotate(-3)">tradurre!</text>
      </g>

      <!-- Linea -->
      <path d="M250,590 Q560,585 870,592" fill="none" stroke="#7a6a5a" stroke-width="1"/>

      <!-- INDIZIO 3: Il Simbolo -->
      <g transform="translate(230, 620)">
        <!-- Schizzo simbolo arcano -->
        <g transform="translate(20, 20)">
          <circle cx="45" cy="45" r="40" fill="none" stroke="#4B0082" stroke-width="2"/>
          <circle cx="45" cy="45" r="25" fill="none" stroke="#4B0082" stroke-width="1.5"/>
          <path d="M45,10 L45,80 M10,45 L80,45" fill="none" stroke="#4B0082" stroke-width="1.5"/>
          <path d="M20,20 L70,70 M70,20 L20,70" fill="none" stroke="#4B0082" stroke-width="1"/>
          <!-- Rune attorno -->
          <text x="45" y="0" font-family="Georgia, serif" font-size="10" fill="#4B0082" text-anchor="middle">&#x16A0;</text>
          <text x="95" y="50" font-family="Georgia, serif" font-size="10" fill="#4B0082" text-anchor="middle">&#x16A2;</text>
          <text x="45" y="100" font-family="Georgia, serif" font-size="10" fill="#4B0082" text-anchor="middle">&#x16A6;</text>
        </g>

        <g transform="translate(150, 0)">
          <text font-family="Georgia, serif" font-size="18" fill="#4B0082" font-style="italic">Simbolo Arcano</text>
          <text font-family="Georgia, serif" font-size="14" fill="#5a4a5a" font-style="italic">
            <tspan x="0" y="30">Inciso sulla macchina.</tspan>
            <tspan x="0" dy="22">Simile a quelli nel</tspan>
            <tspan x="0" dy="22">Necronomicon di Abdul.</tspan>
            <tspan x="0" dy="22">Collegamento con la statuetta?</tspan>
          </text>
        </g>

        <!-- Domanda -->
        <text x="500" y="70" font-family="Georgia, serif" font-size="14" fill="#4B0082" font-style="italic" transform="rotate(5)">Yog-Sothoth?</text>
      </g>

      <!-- Macchia d'inchiostro decorativa -->
      <circle cx="800" cy="850" r="15" fill="#2a1f14" opacity="0.08"/>

      <text x="560" y="990" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle">- 30 -</text>
    </g>

    <!-- ========== PAGINA DESTRA - ALTRI INDIZI E COLLEGAMENTI ========== -->
    <g id="rightPage">
      <path d="M1000,70 L1700,70 Q1710,75 1720,70 L1720,1010 Q1710,1015 1700,1010 L1000,1015 Z"
            fill="#D4C4A8"/>
      <path d="M1720,70 L1720,1010" stroke="#8B7355" stroke-width="3" opacity="0.4"/>

      <!-- INDIZIO 4: Frammento meccanismo -->
      <g transform="translate(1040, 100)">
        <!-- Schizzo ingranaggio -->
        <g transform="translate(0, 20)">
          <circle cx="50" cy="50" r="35" fill="none" stroke="#4a3a2a" stroke-width="2"/>
          <circle cx="50" cy="50" r="15" fill="none" stroke="#4a3a2a" stroke-width="1.5"/>
          <!-- Denti -->
          <rect x="45" y="10" width="10" height="15" fill="none" stroke="#4a3a2a" stroke-width="1"/>
          <rect x="45" y="75" width="10" height="15" fill="none" stroke="#4a3a2a" stroke-width="1"/>
          <rect x="10" y="45" width="15" height="10" fill="none" stroke="#4a3a2a" stroke-width="1"/>
          <rect x="75" y="45" width="15" height="10" fill="none" stroke="#4a3a2a" stroke-width="1"/>
        </g>

        <g transform="translate(120, 0)">
          <text font-family="Georgia, serif" font-size="18" fill="#2a1f14" font-style="italic">Frammento di Meccanismo</text>
          <text font-family="Georgia, serif" font-size="14" fill="#4a3a2a" font-style="italic">
            <tspan x="0" y="35">Raccolto vicino alla macchina.</tspan>
            <tspan x="0" dy="22">Metallo sconosciuto, non arrugginisce.</tspan>
            <tspan x="0" dy="22">Incisioni troppo precise per</tspan>
            <tspan x="0" dy="22">essere state fatte a mano.</tspan>
          </text>
        </g>
      </g>

      <!-- Separatore -->
      <path d="M1060,250 Q1360,245 1680,252" fill="none" stroke="#8a7a6a" stroke-width="1"/>

      <!-- SEZIONE: COLLEGAMENTI -->
      <g transform="translate(1040, 290)">
        <text font-family="Georgia, serif" font-size="20" fill="#2a1f14" font-style="italic">Collegamenti</text>
        <path d="M0,20 L200,20" fill="none" stroke="#6a5a4a" stroke-width="1"/>

        <!-- Diagramma a mano dei collegamenti -->
        <g transform="translate(50, 60)">
          <!-- Statuetta al centro -->
          <ellipse cx="200" cy="100" rx="60" ry="35" fill="none" stroke="#8B0000" stroke-width="2"/>
          <text x="200" y="105" font-family="Georgia, serif" font-size="12" fill="#8B0000" text-anchor="middle">Statuetta</text>

          <!-- Padre -->
          <ellipse cx="50" cy="50" rx="45" ry="25" fill="none" stroke="#4a3a2a" stroke-width="1.5"/>
          <text x="50" y="55" font-family="Georgia, serif" font-size="11" fill="#4a3a2a" text-anchor="middle">Padre</text>
          <path d="M95,60 L140,85" fill="none" stroke="#5a4a3a" stroke-width="1" marker-end="none"/>

          <!-- Macchina -->
          <ellipse cx="350" cy="50" rx="50" ry="25" fill="none" stroke="#4a3a2a" stroke-width="1.5"/>
          <text x="350" y="55" font-family="Georgia, serif" font-size="11" fill="#4a3a2a" text-anchor="middle">Macchina</text>
          <path d="M300,60 L260,85" fill="none" stroke="#5a4a3a" stroke-width="1"/>

          <!-- Simbolo -->
          <ellipse cx="80" cy="180" rx="45" ry="25" fill="none" stroke="#4B0082" stroke-width="1.5"/>
          <text x="80" y="185" font-family="Georgia, serif" font-size="11" fill="#4B0082" text-anchor="middle">Simbolo</text>
          <path d="M125,170 L155,130" fill="none" stroke="#5a4a3a" stroke-width="1"/>

          <!-- Yog-Sothoth -->
          <ellipse cx="320" cy="180" rx="55" ry="25" fill="none" stroke="#4B0082" stroke-width="1.5" stroke-dasharray="5,3"/>
          <text x="320" y="185" font-family="Georgia, serif" font-size="11" fill="#4B0082" text-anchor="middle">Yog-Sothoth?</text>
          <path d="M265,170 L245,130" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4,2"/>

          <!-- Punto interrogativo centrale -->
          <text x="200" y="160" font-family="Georgia, serif" font-size="24" fill="#5a4a3a" text-anchor="middle">?</text>
        </g>
      </g>

      <!-- Domande aperte -->
      <g transform="translate(1040, 580)">
        <text font-family="Georgia, serif" font-size="18" fill="#2a1f14" font-style="italic">Domande senza risposta</text>
        <path d="M0,15 L250,15" fill="none" stroke="#6a5a4a" stroke-width="1"/>

        <text font-family="Georgia, serif" font-size="14" fill="#4a3a2a" font-style="italic">
          <tspan x="20" y="50">• Dove è andato mio padre?</tspan>
          <tspan x="20" dy="28">• Cosa attiva la macchina?</tspan>
          <tspan x="20" dy="28">• Chi ha costruito tutto questo?</tspan>
          <tspan x="20" dy="28">• Quale "scelta difficile"?</tspan>
          <tspan x="20" dy="28">• Chi mi osservava nella biblioteca?</tspan>
        </text>
      </g>

      <!-- Nota finale drammatica -->
      <g transform="translate(1100, 820)">
        <text font-family="Georgia, serif" font-size="16" fill="#5a4a3a" font-style="italic" text-anchor="middle">
          <tspan x="200" dy="0">"La conoscenza è un abisso.</tspan>
          <tspan x="200" dy="24">Più scendo, meno vedo la luce."</tspan>
        </text>
      </g>

      <!-- Freccia ritorno -->
      <g transform="translate(1080, 920)">
        <path d="M80,15 L0,15 L10,5 M0,15 L10,25" fill="none" stroke="#4a3a2a" stroke-width="2"/>
        <text x="100" y="20" font-family="Georgia, serif" font-size="12" fill="#5a4a3a" font-style="italic">alla storia</text>
      </g>

      <text x="1360" y="990" font-family="Georgia, serif" font-size="14" fill="#6a5a4a" text-anchor="middle">- 31 -</text>
    </g>

    <!-- SEGNALIBRI -->
    <g id="bookmarks">
      <g transform="translate(1740, 200)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#8B4513" stroke="#5C3310" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Anime</text>
      </g>
      <g transform="translate(1740, 350)">
        <path d="M0,0 L60,0 L60,80 L30,60 L0,80 Z" fill="#2F4F4F" stroke="#1F3F3F" stroke-width="1"/>
        <text x="30" y="35" font-family="Georgia, serif" font-size="10" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 30, 35)">Luoghi</text>
      </g>
      <!-- Indizi (attivo) -->
      <g transform="translate(1740, 500)">
        <path d="M0,0 L70,0 L70,90 L35,70 L0,90 Z" fill="#4B0082" stroke="#DAA520" stroke-width="2"/>
        <text x="35" y="40" font-family="Georgia, serif" font-size="11" fill="#E8DCC8" text-anchor="middle" transform="rotate(90, 35, 40)">Indizi</text>
      </g>
    </g>

    <!-- Indice capitoli -->
    <g transform="translate(200, 30)">
      <text font-family="Georgia, serif" font-size="11" fill="#6a5a4a">
        <tspan x="0">I</tspan><tspan x="30">II</tspan><tspan x="60" font-weight="bold" fill="#2a1f14">III</tspan><tspan x="95" fill="#9a8a7a">IV</tspan><tspan x="125" fill="#9a8a7a">V</tspan>
      </text>
    </g>

    <!-- Chiusura -->
    <g transform="translate(1700, 50)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="18" fill="#3D2914" stroke="#5C4033" stroke-width="1" opacity="0.8"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#8B7355" stroke-width="2"/>
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#8B7355" stroke-width="2"/>
    </g>
  </g>

</svg>