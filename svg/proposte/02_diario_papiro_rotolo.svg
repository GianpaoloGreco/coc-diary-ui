<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Texture papiro -->
    <pattern id="papyrusTexture" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#E5D9C3"/>
      <line x1="0" y1="10" x2="200" y2="10" stroke="#D4C5A9" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="30" x2="200" y2="30" stroke="#C4B598" stroke-width="0.3" opacity="0.2"/>
      <line x1="0" y1="50" x2="200" y2="50" stroke="#D4C5A9" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="70" x2="200" y2="70" stroke="#C4B598" stroke-width="0.3" opacity="0.2"/>
      <line x1="0" y1="90" x2="200" y2="90" stroke="#D4C5A9" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Gradiente legno bastoni rotolo -->
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="50%" style="stop-color:#6B4423"/>
      <stop offset="100%" style="stop-color:#8B7355"/>
    </linearGradient>

    <!-- Gradiente oro per decorazioni -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#DAA520"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>

    <!-- Ombra -->
    <filter id="dropShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Bordi bruciati papiro -->
    <filter id="roughEdge">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- SFONDO GIOCO -->
  <rect width="1920" height="1080" fill="#1a1a1a"/>
  <rect width="1920" height="1080" fill="#000" opacity="0.7"/>

  <!-- ========== BARRA SUPERIORE ========== -->
  <rect x="0" y="0" width="1920" height="60" fill="#2a1f14" stroke="#5C4033" stroke-width="2"/>

  <!-- Inventario -->
  <g id="inventorySlots2">
    <rect x="20" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="70" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="120" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="170" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="220" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="270" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
  </g>

  <!-- PULSANTE DIARIO (stile rotolo) -->
  <g id="diaryButton2" transform="translate(340, 8)">
    <rect width="100" height="44" fill="#3D2914" stroke="#DAA520" stroke-width="2" rx="5"/>
    <!-- Icona rotolo -->
    <ellipse cx="22" cy="22" rx="6" ry="12" fill="#E5D9C3" stroke="#8B7355" stroke-width="1"/>
    <rect x="22" y="12" width="18" height="20" fill="#E5D9C3"/>
    <ellipse cx="40" cy="22" rx="4" ry="10" fill="#D4C5A9" stroke="#8B7355" stroke-width="1"/>
    <text x="62" y="28" font-family="Georgia, serif" font-size="11" fill="#DAA520" font-weight="bold">DIARIO</text>
  </g>

  <!-- ========== DIARIO ROTOLO APERTO ========== -->
  <g id="scrollDiary" filter="url(#dropShadow2)">

    <!-- Bastone superiore rotolo -->
    <rect x="200" y="80" width="1520" height="30" fill="url(#woodGradient)" rx="15"/>
    <!-- Pomelli decorativi -->
    <circle cx="200" cy="95" r="20" fill="url(#goldGradient)"/>
    <circle cx="1720" cy="95" r="20" fill="url(#goldGradient)"/>
    <circle cx="200" cy="95" r="12" fill="#5C4033"/>
    <circle cx="1720" cy="95" r="12" fill="#5C4033"/>

    <!-- Papiro principale -->
    <rect x="220" y="110" width="1480" height="820" fill="url(#papyrusTexture)"/>

    <!-- Bordi irregolari simulati -->
    <path d="M220,110 Q225,115 220,125 Q230,130 220,140 L220,920 Q230,925 220,930"
          fill="none" stroke="#C4B598" stroke-width="2"/>
    <path d="M1700,110 Q1695,120 1700,130 Q1690,140 1700,150 L1700,920 Q1690,925 1700,930"
          fill="none" stroke="#C4B598" stroke-width="2"/>

    <!-- Bastone inferiore rotolo -->
    <rect x="200" y="930" width="1520" height="30" fill="url(#woodGradient)" rx="15"/>
    <circle cx="200" cy="945" r="20" fill="url(#goldGradient)"/>
    <circle cx="1720" cy="945" r="20" fill="url(#goldGradient)"/>
    <circle cx="200" cy="945" r="12" fill="#5C4033"/>
    <circle cx="1720" cy="945" r="12" fill="#5C4033"/>

    <!-- ========== HEADER CAPITOLO ========== -->
    <g id="chapterHeader">
      <!-- Decorazione arabesca superiore -->
      <path d="M760,140 Q860,120 960,140 Q1060,120 1160,140" fill="none" stroke="#B8860B" stroke-width="2"/>
      <path d="M760,145 Q860,165 960,145 Q1060,165 1160,145" fill="none" stroke="#B8860B" stroke-width="2"/>

      <text x="960" y="190" font-family="Georgia, serif" font-size="36" fill="#3D2914" text-anchor="middle" font-weight="bold">CAPITOLO III</text>
      <text x="960" y="230" font-family="Georgia, serif" font-size="24" fill="#5C4033" text-anchor="middle" font-style="italic">La Biblioteca di Atene</text>

      <!-- Linea decorativa -->
      <line x1="400" y1="260" x2="1520" y2="260" stroke="#B8860B" stroke-width="1"/>
      <circle cx="960" cy="260" r="5" fill="#B8860B"/>
    </g>

    <!-- ========== LAYOUT A TRE COLONNE ========== -->

    <!-- COLONNA SINISTRA: Immagine principale -->
    <g id="leftColumn">
      <rect x="260" y="290" width="420" height="320" fill="#2F4F4F" stroke="#5C4033" stroke-width="3"/>
      <text x="470" y="460" font-family="Georgia, serif" font-size="16" fill="#8B7355" text-anchor="middle" font-style="italic">[Motion Comic]</text>

      <!-- Didascalia -->
      <text x="470" y="640" font-family="Georgia, serif" font-size="14" fill="#3D2914" text-anchor="middle" font-style="italic">"Il meccanismo impossibile"</text>
    </g>

    <!-- COLONNA CENTRALE: Testo narrativo -->
    <g id="centerColumn">
      <text font-family="Georgia, serif" font-size="15" fill="#3D2914">
        <tspan x="720" y="320">Il viaggio verso Atene fu lungo</tspan>
        <tspan x="720" dy="24">e pieno di presagi inquietanti.</tspan>
        <tspan x="720" dy="24">Durante la traversata, i marinai</tspan>
        <tspan x="720" dy="24">parlavano sottovoce di strane</tspan>
        <tspan x="720" dy="24">luci viste all'orizzonte nelle</tspan>
        <tspan x="720" dy="24">notti senza luna.</tspan>
        <tspan x="720" dy="36">Arrivato finalmente alla Grande</tspan>
        <tspan x="720" dy="24">Biblioteca, Rabian fu colpito</tspan>
        <tspan x="720" dy="24">dalla magnificenza degli antichi</tspan>
        <tspan x="720" dy="24">scaffali. Ma qualcosa non andava.</tspan>
        <tspan x="720" dy="24">I custodi sembravano nervosi...</tspan>
      </text>
    </g>

    <!-- COLONNA DESTRA: Immagine secondaria + note -->
    <g id="rightColumn">
      <rect x="1240" y="290" width="420" height="220" fill="#1C3A3A" stroke="#5C4033" stroke-width="3"/>
      <text x="1450" y="410" font-family="Georgia, serif" font-size="14" fill="#8B7355" text-anchor="middle" font-style="italic">[Illustrazione]</text>

      <!-- Note di Rabian -->
      <rect x="1240" y="530" width="420" height="180" fill="#D4C5A9" stroke="#8B7355" stroke-width="1"/>
      <text x="1260" y="560" font-family="Georgia, serif" font-size="13" fill="#3D2914" font-style="italic">Note personali:</text>
      <text font-family="Georgia, serif" font-size="12" fill="#5C4033">
        <tspan x="1260" y="590">- Simboli simili al Necronomicon</tspan>
        <tspan x="1260" dy="20">- Il custode menziona "gli antichi"</tspan>
        <tspan x="1260" dy="20">- Meccanismo datato: pre-umano?</tspan>
        <tspan x="1260" dy="20">- Collegamento con la statuetta</tspan>
      </text>
    </g>

    <!-- ========== SEZIONI/TAB ORIZZONTALI ========== -->
    <g id="sectionTabs" transform="translate(260, 750)">
      <!-- Tab Storia (attivo) -->
      <g>
        <rect x="0" y="0" width="180" height="50" fill="#B8860B" stroke="#DAA520" stroke-width="2" rx="5"/>
        <text x="90" y="32" font-family="Georgia, serif" font-size="16" fill="#E8DCC8" text-anchor="middle" font-weight="bold">STORIA</text>
      </g>
      <!-- Tab Personaggi -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="180" height="50" fill="#5C4033" stroke="#8B7355" stroke-width="1" rx="5"/>
        <text x="90" y="32" font-family="Georgia, serif" font-size="16" fill="#C4B598" text-anchor="middle">PERSONAGGI</text>
      </g>
      <!-- Tab Luoghi -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="180" height="50" fill="#5C4033" stroke="#8B7355" stroke-width="1" rx="5"/>
        <text x="90" y="32" font-family="Georgia, serif" font-size="16" fill="#C4B598" text-anchor="middle">LUOGHI</text>
      </g>
      <!-- Tab Indizi -->
      <g transform="translate(600, 0)">
        <rect x="0" y="0" width="180" height="50" fill="#5C4033" stroke="#8B7355" stroke-width="1" rx="5"/>
        <text x="90" y="32" font-family="Georgia, serif" font-size="16" fill="#C4B598" text-anchor="middle">INDIZI</text>
      </g>
      <!-- Tab Lore -->
      <g transform="translate(800, 0)">
        <rect x="0" y="0" width="180" height="50" fill="#5C4033" stroke="#8B7355" stroke-width="1" rx="5"/>
        <text x="90" y="32" font-family="Georgia, serif" font-size="16" fill="#C4B598" text-anchor="middle">LORE</text>
      </g>
    </g>

    <!-- ========== NAVIGAZIONE CAPITOLI (in basso) ========== -->
    <g id="chapterNav" transform="translate(260, 830)">
      <!-- Capitoli come punti -->
      <circle cx="50" cy="20" r="15" fill="#B8860B" stroke="#DAA520" stroke-width="2"/>
      <text x="50" y="26" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" text-anchor="middle">I</text>

      <circle cx="110" cy="20" r="15" fill="#B8860B" stroke="#DAA520" stroke-width="2"/>
      <text x="110" y="26" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" text-anchor="middle">II</text>

      <circle cx="170" cy="20" r="18" fill="#DAA520" stroke="#FFD700" stroke-width="3"/>
      <text x="170" y="26" font-family="Georgia, serif" font-size="14" fill="#3D2914" text-anchor="middle" font-weight="bold">III</text>

      <circle cx="230" cy="20" r="15" fill="#3D2914" stroke="#5C4033" stroke-width="2"/>
      <text x="230" y="26" font-family="Georgia, serif" font-size="14" fill="#5C4033" text-anchor="middle">IV</text>

      <circle cx="290" cy="20" r="15" fill="#3D2914" stroke="#5C4033" stroke-width="2"/>
      <text x="290" y="26" font-family="Georgia, serif" font-size="14" fill="#5C4033" text-anchor="middle">V</text>

      <!-- Linea di progressione -->
      <line x1="65" y1="20" x2="95" y2="20" stroke="#B8860B" stroke-width="3"/>
      <line x1="125" y1="20" x2="152" y2="20" stroke="#B8860B" stroke-width="3"/>
      <line x1="188" y1="20" x2="215" y2="20" stroke="#5C4033" stroke-width="2" stroke-dasharray="5,3"/>
      <line x1="245" y1="20" x2="275" y2="20" stroke="#5C4033" stroke-width="2" stroke-dasharray="5,3"/>

      <!-- Frecce navigazione -->
      <g transform="translate(1300, 0)" style="cursor: pointer;">
        <rect x="0" y="0" width="80" height="40" fill="#5C4033" stroke="#8B7355" stroke-width="2" rx="5"/>
        <path d="M25,20 L40,10 L40,30 Z" fill="#DAA520"/>
        <text x="55" y="26" font-family="Georgia, serif" font-size="12" fill="#C4B598">PREC</text>
      </g>
      <g transform="translate(1400, 0)" style="cursor: pointer;">
        <rect x="0" y="0" width="80" height="40" fill="#5C4033" stroke="#8B7355" stroke-width="2" rx="5"/>
        <text x="20" y="26" font-family="Georgia, serif" font-size="12" fill="#C4B598">SUCC</text>
        <path d="M65,20 L50,10 L50,30 Z" fill="#DAA520"/>
      </g>
    </g>

    <!-- ========== PULSANTE CHIUSURA ========== -->
    <g id="closeButton2" transform="translate(1680, 130)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="25" fill="#8B0000" stroke="#DAA520" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- ========== DECORAZIONI ANGOLI ARABESCO ========== -->
    <g id="cornerDecorations" fill="none" stroke="#B8860B" stroke-width="1.5">
      <!-- Angolo top-left -->
      <path d="M250,130 Q280,130 280,160 M250,145 Q265,145 265,160 M250,130 L250,170"/>
      <!-- Angolo top-right -->
      <path d="M1670,130 Q1640,130 1640,160 M1670,145 Q1655,145 1655,160 M1670,130 L1670,170"/>
      <!-- Angolo bottom-left -->
      <path d="M250,910 Q280,910 280,880 M250,895 Q265,895 265,880 M250,910 L250,870"/>
      <!-- Angolo bottom-right -->
      <path d="M1670,910 Q1640,910 1640,880 M1670,895 Q1655,895 1655,880 M1670,910 L1670,870"/>
    </g>

  </g>

  <!-- ========== LEGENDA ========== -->
  <g id="legend2" transform="translate(20, 1000)">
    <text font-family="Arial, sans-serif" font-size="12" fill="#666">
      <tspan x="0" dy="0">PROPOSTA 2: Diario Papiro/Rotolo - Stile Oman Antico</tspan>
      <tspan x="0" dy="18">Layout a colonne | Tab sezioni orizzontali | Navigazione capitoli con punti progressione</tspan>
    </text>
  </g>

</svg>