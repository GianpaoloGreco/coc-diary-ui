<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- CANVAS BASE: Schermata di gioco simulata -->
  <defs>
    <!-- Texture pergamena -->
    <pattern id="parchmentTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#E8DCC8"/>
      <circle cx="20" cy="30" r="1" fill="#D4C5A9" opacity="0.5"/>
      <circle cx="60" cy="70" r="1.5" fill="#C4B598" opacity="0.4"/>
      <circle cx="80" cy="20" r="1" fill="#D4C5A9" opacity="0.3"/>
    </pattern>

    <!-- Gradiente bordo libro -->
    <linearGradient id="leatherGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D2914"/>
      <stop offset="50%" style="stop-color:#5C4033"/>
      <stop offset="100%" style="stop-color:#3D2914"/>
    </linearGradient>

    <!-- Ombra -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Gradiente cosmico per decorazioni -->
    <linearGradient id="cosmicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4B0082"/>
      <stop offset="100%" style="stop-color:#1C3A3A"/>
    </linearGradient>
  </defs>

  <!-- SFONDO GIOCO (simulato - blur scuro) -->
  <rect width="1920" height="1080" fill="#1a1a1a"/>
  <rect width="1920" height="1080" fill="#000" opacity="0.7"/>

  <!-- ========== BARRA SUPERIORE CON INVENTARIO E DIARIO ========== -->
  <rect x="0" y="0" width="1920" height="60" fill="#2a1f14" stroke="#5C4033" stroke-width="2"/>

  <!-- Inventario (placeholder slot) -->
  <g id="inventorySlots">
    <rect x="20" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="70" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="120" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="170" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="220" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="270" y="8" width="44" height="44" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
  </g>

  <!-- PULSANTE DIARIO (vicino inventario) -->
  <g id="diaryButton" transform="translate(340, 8)">
    <rect width="90" height="44" fill="#3D2914" stroke="#DAA520" stroke-width="2" rx="5"/>
    <!-- Icona libro -->
    <rect x="12" y="10" width="20" height="24" fill="#E8DCC8" rx="2"/>
    <line x1="22" y1="10" x2="22" y2="34" stroke="#3D2914" stroke-width="2"/>
    <line x1="16" y1="16" x2="28" y2="16" stroke="#8B7355" stroke-width="1"/>
    <line x1="16" y1="20" x2="28" y2="20" stroke="#8B7355" stroke-width="1"/>
    <line x1="16" y1="24" x2="28" y2="24" stroke="#8B7355" stroke-width="1"/>
    <text x="52" y="28" font-family="Georgia, serif" font-size="11" fill="#DAA520" font-weight="bold">DIARIO</text>
  </g>

  <!-- ========== DIARIO APERTO (LIBRO ANTICO) ========== -->
  <g id="diaryOpen" filter="url(#dropShadow)">

    <!-- Copertina esterna libro -->
    <rect x="260" y="100" width="1400" height="880" fill="url(#leatherGradient)" rx="15"/>

    <!-- Rilegatura centrale -->
    <rect x="945" y="100" width="30" height="880" fill="#2a1f14"/>
    <line x1="952" y1="120" x2="952" y2="960" stroke="#1a1208" stroke-width="2"/>
    <line x1="968" y1="120" x2="968" y2="960" stroke="#1a1208" stroke-width="2"/>

    <!-- Pagina sinistra (IMMAGINE/MOTION COMIC) -->
    <rect x="280" y="120" width="660" height="840" fill="url(#parchmentTexture)" rx="5"/>

    <!-- Cornice decorativa pagina sinistra -->
    <rect x="300" y="140" width="620" height="800" fill="none" stroke="#8B7355" stroke-width="2"/>
    <rect x="310" y="150" width="600" height="780" fill="none" stroke="#C4B598" stroke-width="1"/>

    <!-- Area immagine motion comic -->
    <rect x="330" y="200" width="560" height="400" fill="#2F4F4F" stroke="#5C4033" stroke-width="3"/>
    <text x="610" y="410" font-family="Georgia, serif" font-size="18" fill="#8B7355" text-anchor="middle" font-style="italic">[Immagine Motion Comic]</text>

    <!-- Didascalia immagine -->
    <rect x="330" y="620" width="560" height="60" fill="#D4C5A9"/>
    <text x="610" y="658" font-family="Georgia, serif" font-size="14" fill="#3D2914" text-anchor="middle" font-style="italic">"La macchina che non dovrebbe esistere..."</text>

    <!-- Numero capitolo pagina sinistra -->
    <text x="610" y="180" font-family="Georgia, serif" font-size="24" fill="#5C4033" text-anchor="middle" font-weight="bold">CAPITOLO III</text>

    <!-- Decorazione angoli -->
    <path d="M300,140 L340,140 L300,180 Z" fill="#8B7355"/>
    <path d="M920,140 L880,140 L920,180 Z" fill="#8B7355"/>
    <path d="M300,940 L340,940 L300,900 Z" fill="#8B7355"/>
    <path d="M920,940 L880,940 L920,900 Z" fill="#8B7355"/>

    <!-- Pagina destra (TESTO NARRATIVO) -->
    <rect x="980" y="120" width="660" height="840" fill="url(#parchmentTexture)" rx="5"/>

    <!-- Cornice decorativa pagina destra -->
    <rect x="1000" y="140" width="620" height="800" fill="none" stroke="#8B7355" stroke-width="2"/>
    <rect x="1010" y="150" width="600" height="780" fill="none" stroke="#C4B598" stroke-width="1"/>

    <!-- Titolo capitolo -->
    <text x="1310" y="190" font-family="Georgia, serif" font-size="28" fill="#3D2914" text-anchor="middle" font-weight="bold">La Biblioteca di Atene</text>
    <line x1="1100" y1="210" x2="1520" y2="210" stroke="#8B7355" stroke-width="1"/>

    <!-- Testo narrativo (simulato) -->
    <text x="1030" y="260" font-family="Georgia, serif" font-size="16" fill="#3D2914">
      <tspan x="1030" dy="0">Il viaggio verso Atene fu lungo e pieno di presagi</tspan>
      <tspan x="1030" dy="28">inquietanti. Durante la traversata, i marinai</tspan>
      <tspan x="1030" dy="28">parlavano sottovoce di strane luci viste</tspan>
      <tspan x="1030" dy="28">all'orizzonte nelle notti senza luna.</tspan>
      <tspan x="1030" dy="42">Arrivato finalmente alla Grande Biblioteca,</tspan>
      <tspan x="1030" dy="28">Rabian fu colpito dalla magnificenza degli</tspan>
      <tspan x="1030" dy="28">antichi scaffali. Ma qualcosa non andava.</tspan>
      <tspan x="1030" dy="28">I custodi sembravano nervosi, e certi tomi</tspan>
      <tspan x="1030" dy="28">erano stati rimossi dalle loro postazioni...</tspan>
      <tspan x="1030" dy="42">Fu allora che scoprì la macchina. Un</tspan>
      <tspan x="1030" dy="28">congegno che sfidava ogni logica, nascosto</tspan>
      <tspan x="1030" dy="28">nelle catacombe sotto la biblioteca.</tspan>
      <tspan x="1030" dy="28">Un meccanismo che non apparteneva a</tspan>
      <tspan x="1030" dy="28">questa era... forse a nessuna era umana.</tspan>
    </text>

    <!-- Decorazione angoli pagina destra -->
    <path d="M1000,140 L1040,140 L1000,180 Z" fill="#8B7355"/>
    <path d="M1620,140 L1580,140 L1620,180 Z" fill="#8B7355"/>
    <path d="M1000,940 L1040,940 L1000,900 Z" fill="#8B7355"/>
    <path d="M1620,940 L1580,940 L1620,900 Z" fill="#8B7355"/>

    <!-- ========== TAB CAPITOLI (laterale sinistro) ========== -->
    <g id="chapterTabs">
      <!-- Tab Capitolo I -->
      <g transform="translate(230, 180)">
        <path d="M0,0 L-40,10 L-40,50 L0,60 Z" fill="#5C4033" stroke="#3D2914" stroke-width="1"/>
        <text x="-28" y="38" font-family="Georgia, serif" font-size="14" fill="#DAA520" transform="rotate(-90, -28, 38)">I</text>
      </g>
      <!-- Tab Capitolo II -->
      <g transform="translate(230, 260)">
        <path d="M0,0 L-40,10 L-40,50 L0,60 Z" fill="#5C4033" stroke="#3D2914" stroke-width="1"/>
        <text x="-28" y="38" font-family="Georgia, serif" font-size="14" fill="#DAA520" transform="rotate(-90, -28, 38)">II</text>
      </g>
      <!-- Tab Capitolo III (attivo) -->
      <g transform="translate(230, 340)">
        <path d="M0,0 L-50,10 L-50,50 L0,60 Z" fill="#8B7355" stroke="#DAA520" stroke-width="2"/>
        <text x="-35" y="38" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" font-weight="bold" transform="rotate(-90, -35, 38)">III</text>
      </g>
      <!-- Tab Capitolo IV (bloccato) -->
      <g transform="translate(230, 420)">
        <path d="M0,0 L-40,10 L-40,50 L0,60 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/>
        <text x="-28" y="38" font-family="Georgia, serif" font-size="14" fill="#5C4033" transform="rotate(-90, -28, 38)">IV</text>
        <!-- Lucchetto -->
        <rect x="-32" y="42" width="8" height="6" fill="none" stroke="#5C4033" stroke-width="1"/>
        <circle cx="-28" cy="40" r="3" fill="none" stroke="#5C4033" stroke-width="1"/>
      </g>
      <!-- Tab Capitolo V (bloccato) -->
      <g transform="translate(230, 500)">
        <path d="M0,0 L-40,10 L-40,50 L0,60 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/>
        <text x="-28" y="38" font-family="Georgia, serif" font-size="14" fill="#5C4033" transform="rotate(-90, -28, 38)">V</text>
        <rect x="-32" y="42" width="8" height="6" fill="none" stroke="#5C4033" stroke-width="1"/>
        <circle cx="-28" cy="40" r="3" fill="none" stroke="#5C4033" stroke-width="1"/>
      </g>
    </g>

    <!-- ========== NAVIGAZIONE PAGINE ========== -->
    <g id="pageNavigation">
      <!-- Freccia pagina precedente -->
      <g transform="translate(350, 850)" style="cursor: pointer;">
        <circle cx="0" cy="0" r="25" fill="#3D2914" stroke="#8B7355" stroke-width="2"/>
        <path d="M5,-8 L-8,0 L5,8" fill="none" stroke="#DAA520" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- Numero pagina -->
      <text x="610" y="860" font-family="Georgia, serif" font-size="16" fill="#5C4033" text-anchor="middle">Pagina 12 di 24</text>
      <!-- Freccia pagina successiva -->
      <g transform="translate(870, 850)" style="cursor: pointer;">
        <circle cx="0" cy="0" r="25" fill="#3D2914" stroke="#8B7355" stroke-width="2"/>
        <path d="M-5,-8 L8,0 L-5,8" fill="none" stroke="#DAA520" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ========== PULSANTE CHIUSURA ========== -->
    <g id="closeButton" transform="translate(1620, 130)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="22" fill="#8B0000" stroke="#DAA520" stroke-width="2"/>
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="-8" x2="-8" y2="8" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- ========== SIMBOLO LOVECRAFTIANO DECORATIVO ========== -->
    <g id="eldritchSymbol" transform="translate(960, 980)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#4B0082" stroke-width="2" opacity="0.6"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.4"/>
      <path d="M0,-25 L5,-10 L20,-10 L8,2 L13,18 L0,8 L-13,18 L-8,2 L-20,-10 L-5,-10 Z" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.5"/>
    </g>

  </g>

  <!-- ========== LEGENDA ========== -->
  <g id="legend" transform="translate(20, 1000)">
    <text font-family="Arial, sans-serif" font-size="12" fill="#666">
      <tspan x="0" dy="0">PROPOSTA 1: Diario Libro Antico - Stile RDR2/Uncharted</tspan>
      <tspan x="0" dy="18">Due pagine: sinistra immagine, destra testo | Tab capitoli laterali | Navigazione pagine</tspan>
    </text>
  </g>

</svg>