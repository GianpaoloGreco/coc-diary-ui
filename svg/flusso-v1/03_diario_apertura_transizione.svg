<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="leatherGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D2914"/>
      <stop offset="50%" style="stop-color:#5C4033"/>
      <stop offset="100%" style="stop-color:#3D2914"/>
    </linearGradient>
    <filter id="bookShadow">
      <feDropShadow dx="0" dy="15" stdDeviation="30" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ========== SFONDO OSCURATO ========== -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- Sfondo gioco sfocato/oscurato -->
  <rect width="1920" height="1080" fill="#1a1a1a" opacity="0.3"/>

  <!-- ========== BARRA UI (visibile ma sfumata) ========== -->
  <rect x="0" y="0" width="1920" height="70" fill="#2a1f14" opacity="0.5"/>

  <!-- ========== LIBRO IN APERTURA (stato intermedio) ========== -->
  <g id="bookOpening" transform="translate(960, 540)" filter="url(#bookShadow)">
    <!-- Copertina posteriore (visibile) -->
    <rect x="-400" y="-300" width="800" height="600" fill="url(#leatherGradient)" rx="10"/>

    <!-- Decorazione copertina -->
    <rect x="-380" y="-280" width="760" height="560" fill="none" stroke="#8B7355" stroke-width="2"/>
    <rect x="-360" y="-260" width="720" height="520" fill="none" stroke="#5C4033" stroke-width="1"/>

    <!-- Simbolo centrale copertina -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="80" fill="none" stroke="#DAA520" stroke-width="3"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#B8860B" stroke-width="2"/>
      <!-- Elder Sign stilizzato -->
      <path d="M0,-50 L0,50 M-43,-25 L43,25 M-43,25 L43,-25" fill="none" stroke="#DAA520" stroke-width="2"/>
      <circle cx="0" cy="0" r="20" fill="#3D2914" stroke="#DAA520" stroke-width="2"/>
    </g>

    <!-- Titolo libro -->
    <text x="0" y="-200" font-family="Georgia, serif" font-size="28" fill="#DAA520" text-anchor="middle" font-weight="bold">DIARIO DI RABIAN</text>
    <text x="0" y="-165" font-family="Georgia, serif" font-size="16" fill="#8B7355" text-anchor="middle" font-style="italic">Cronache di Innsmouth</text>

    <!-- Angoli decorativi -->
    <path d="M-380,-280 L-340,-280 L-380,-240 Z" fill="#DAA520"/>
    <path d="M380,-280 L340,-280 L380,-240 Z" fill="#DAA520"/>
    <path d="M-380,280 L-340,280 L-380,240 Z" fill="#DAA520"/>
    <path d="M380,280 L340,280 L380,240 Z" fill="#DAA520"/>

    <!-- Pagine interne che si intravedono -->
    <rect x="-395" y="-295" width="790" height="590" fill="#E8DCC8" rx="8" opacity="0.3"/>
    <rect x="-390" y="-290" width="780" height="580" fill="#E8DCC8" rx="6" opacity="0.5"/>

    <!-- Copertina anteriore (in apertura - ruotata) -->
    <g transform="skewY(-5) translate(200, 0)">
      <rect x="-400" y="-300" width="400" height="600" fill="url(#leatherGradient)" rx="10"/>
      <rect x="-380" y="-280" width="360" height="560" fill="none" stroke="#8B7355" stroke-width="2"/>

      <!-- Mezzo simbolo -->
      <g transform="translate(-200, 0)">
        <path d="M0,-50 L0,50" fill="none" stroke="#DAA520" stroke-width="2"/>
        <path d="M0,0 L-43,-25 M0,0 L-43,25" fill="none" stroke="#DAA520" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- ========== INDICATORE CARICAMENTO ========== -->
  <g transform="translate(960, 900)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="18" fill="#DAA520" text-anchor="middle">Apertura diario...</text>

    <!-- Barra progresso -->
    <rect x="-100" y="20" width="200" height="8" fill="#2a1f14" stroke="#5C4033" stroke-width="1" rx="4"/>
    <rect x="-100" y="20" width="120" height="8" fill="#DAA520" rx="4"/>
  </g>

  <!-- ========== LABEL SCHERMATA ========== -->
  <rect x="20" y="1030" width="500" height="30" fill="#000" opacity="0.7" rx="5"/>
  <text x="40" y="1052" font-family="Arial, sans-serif" font-size="14" fill="#DAA520">STATO: Transizione apertura diario (animazione ~0.5s)</text>

</svg>