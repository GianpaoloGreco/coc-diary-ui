<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1400" width="1920" height="1400">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DAA520"/>
    </marker>
  </defs>

  <!-- Sfondo -->
  <rect width="1920" height="1400" fill="#1a1208"/>

  <!-- Titolo -->
  <text x="960" y="60" font-family="Georgia, serif" font-size="42" fill="#DAA520" text-anchor="middle" font-weight="bold">MAPPA FLUSSO DIARIO - LIBRO ANTICO</text>
  <text x="960" y="100" font-family="Georgia, serif" font-size="20" fill="#8B7355" text-anchor="middle">Chronicle of Innsmouth: Curse of Chaos</text>
  <line x1="300" y1="120" x2="1620" y2="120" stroke="#5C4033" stroke-width="2"/>

  <!-- ========== RIGA 1: STATO CHIUSO ========== -->
  <g transform="translate(100, 160)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="24" fill="#DAA520" font-weight="bold">1. GAMEPLAY (Diario Chiuso)</text>

    <!-- Card 00 -->
    <g transform="translate(0, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="180" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="260" height="100" fill="#3D2914" rx="5"/>
      <text x="140" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Screenshot gameplay]</text>
      <text x="140" y="135" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" text-anchor="middle" font-weight="bold">00_gioco_diario_chiuso</text>
      <text x="140" y="160" font-family="Georgia, serif" font-size="11" fill="#8B7355" text-anchor="middle">Schermata normale di gioco</text>
    </g>

    <!-- Freccia -->
    <line x1="300" y1="120" x2="380" y2="120" stroke="#DAA520" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Card 01 -->
    <g transform="translate(400, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="180" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="260" height="100" fill="#3D2914" rx="5"/>
      <text x="140" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Pulsante illuminato]</text>
      <text x="140" y="135" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" text-anchor="middle" font-weight="bold">01_pulsante_hover</text>
      <text x="140" y="160" font-family="Georgia, serif" font-size="11" fill="#8B7355" text-anchor="middle">Mouse over + tooltip</text>
    </g>

    <!-- Freccia -->
    <line x1="700" y1="120" x2="780" y2="120" stroke="#DAA520" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Card 02 -->
    <g transform="translate(800, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="180" fill="#2a1f14" stroke="#8B0000" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="260" height="100" fill="#3D2914" rx="5"/>
      <circle cx="240" cy="30" r="15" fill="#8B0000"/>
      <text x="240" y="35" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
      <text x="140" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Badge notifica]</text>
      <text x="140" y="135" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" text-anchor="middle" font-weight="bold">02_pulsante_notifica</text>
      <text x="140" y="160" font-family="Georgia, serif" font-size="11" fill="#8B7355" text-anchor="middle">Nuovo contenuto + popup</text>
    </g>
  </g>

  <!-- ========== RIGA 2: TRANSIZIONE APERTURA ========== -->
  <g transform="translate(100, 400)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="24" fill="#DAA520" font-weight="bold">2. APERTURA</text>

    <!-- Freccia verticale da sopra -->
    <line x1="940" y1="-50" x2="940" y2="20" stroke="#DAA520" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="960" y="-20" font-family="Georgia, serif" font-size="12" fill="#8B7355">Click</text>

    <!-- Card 03 -->
    <g transform="translate(800, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="180" fill="#2a1f14" stroke="#DAA520" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="260" height="100" fill="#3D2914" rx="5"/>
      <text x="140" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Libro che si apre]</text>
      <text x="140" y="135" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" text-anchor="middle" font-weight="bold">03_apertura_transizione</text>
      <text x="140" y="160" font-family="Georgia, serif" font-size="11" fill="#DAA520" text-anchor="middle">Animazione ~0.5s</text>
    </g>
  </g>

  <!-- ========== RIGA 3: DIARIO APERTO - TAB ========== -->
  <g transform="translate(100, 650)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="24" fill="#DAA520" font-weight="bold">3. DIARIO APERTO - Navigazione Tab</text>

    <!-- Freccia da apertura -->
    <line x1="940" y1="-50" x2="940" y2="20" stroke="#DAA520" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Card 04 - Storia -->
    <g transform="translate(0, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="260" height="180" fill="#2a1f14" stroke="#DAA520" stroke-width="3" rx="10"/>
      <rect x="10" y="10" width="240" height="100" fill="#3D2914" rx="5"/>
      <text x="130" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Motion Comic + Testo]</text>
      <text x="130" y="135" font-family="Georgia, serif" font-size="13" fill="#E8DCC8" text-anchor="middle" font-weight="bold">04_tab_storia</text>
      <text x="130" y="155" font-family="Georgia, serif" font-size="11" fill="#DAA520" text-anchor="middle">DEFAULT</text>
    </g>

    <!-- Card 05 - Galleria -->
    <g transform="translate(280, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="260" height="180" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="240" height="100" fill="#3D2914" rx="5"/>
      <text x="130" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Griglia thumbnail]</text>
      <text x="130" y="135" font-family="Georgia, serif" font-size="13" fill="#E8DCC8" text-anchor="middle" font-weight="bold">05_tab_galleria</text>
      <text x="130" y="160" font-family="Georgia, serif" font-size="11" fill="#8B7355" text-anchor="middle">Immagini sbloccate</text>
    </g>

    <!-- Card 06 - Personaggi -->
    <g transform="translate(560, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="260" height="180" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="240" height="100" fill="#3D2914" rx="5"/>
      <text x="130" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Schede NPC]</text>
      <text x="130" y="135" font-family="Georgia, serif" font-size="13" fill="#E8DCC8" text-anchor="middle" font-weight="bold">06_tab_personaggi</text>
      <text x="130" y="160" font-family="Georgia, serif" font-size="11" fill="#8B7355" text-anchor="middle">Lista + dettaglio</text>
    </g>

    <!-- Card 07 - Luoghi -->
    <g transform="translate(840, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="260" height="180" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="240" height="100" fill="#3D2914" rx="5"/>
      <text x="130" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Mappa + Lista]</text>
      <text x="130" y="135" font-family="Georgia, serif" font-size="13" fill="#E8DCC8" text-anchor="middle" font-weight="bold">07_tab_luoghi</text>
      <text x="130" y="160" font-family="Georgia, serif" font-size="11" fill="#8B7355" text-anchor="middle">Location visitate</text>
    </g>

    <!-- Card 08 - Indizi -->
    <g transform="translate(1120, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="260" height="180" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="240" height="100" fill="#3D2914" rx="5"/>
      <text x="130" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Oggetti + Filtri]</text>
      <text x="130" y="135" font-family="Georgia, serif" font-size="13" fill="#E8DCC8" text-anchor="middle" font-weight="bold">08_tab_indizi</text>
      <text x="130" y="160" font-family="Georgia, serif" font-size="11" fill="#8B7355" text-anchor="middle">Artefatti raccolti</text>
    </g>

    <!-- Frecce tra tab -->
    <g transform="translate(0, 120)">
      <line x1="260" y1="0" x2="280" y2="0" stroke="#5C4033" stroke-width="1"/>
      <line x1="540" y1="0" x2="560" y2="0" stroke="#5C4033" stroke-width="1"/>
      <line x1="820" y1="0" x2="840" y2="0" stroke="#5C4033" stroke-width="1"/>
      <line x1="1100" y1="0" x2="1120" y2="0" stroke="#5C4033" stroke-width="1"/>
    </g>
  </g>

  <!-- ========== RIGA 4: NAVIGAZIONE CAPITOLI ========== -->
  <g transform="translate(100, 900)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="24" fill="#DAA520" font-weight="bold">4. NAVIGAZIONE CAPITOLI (Sidebar laterale)</text>

    <!-- Card 10 - Cambio capitolo -->
    <g transform="translate(0, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="180" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="260" height="100" fill="#3D2914" rx="5"/>
      <text x="140" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Cap. II selezionato]</text>
      <text x="140" y="135" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" text-anchor="middle" font-weight="bold">10_cambio_capitolo</text>
      <text x="140" y="160" font-family="Georgia, serif" font-size="11" fill="#8B7355" text-anchor="middle">Contenuto diverso</text>
    </g>

    <!-- Freccia -->
    <line x1="300" y1="120" x2="380" y2="120" stroke="#DAA520" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Card 11 - Bloccato -->
    <g transform="translate(400, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="180" fill="#2a1f14" stroke="#8B0000" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="260" height="100" fill="#3D2914" rx="5"/>
      <text x="140" y="55" font-family="Georgia, serif" font-size="30" fill="#5C4033" text-anchor="middle">&#128274;</text>
      <text x="140" y="80" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Lucchetto]</text>
      <text x="140" y="135" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" text-anchor="middle" font-weight="bold">11_capitolo_bloccato</text>
      <text x="140" y="160" font-family="Georgia, serif" font-size="11" fill="#8B0000" text-anchor="middle">Requisiti + teaser</text>
    </g>
  </g>

  <!-- ========== RIGA 5: CHIUSURA ========== -->
  <g transform="translate(100, 1150)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="24" fill="#DAA520" font-weight="bold">5. CHIUSURA</text>

    <!-- Freccia da diario aperto -->
    <line x1="940" y1="-80" x2="940" y2="20" stroke="#DAA520" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="960" y="-50" font-family="Georgia, serif" font-size="12" fill="#8B7355">Click X / ESC</text>

    <!-- Card 09 - Chiusura -->
    <g transform="translate(800, 30)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="180" fill="#2a1f14" stroke="#DAA520" stroke-width="2" rx="10"/>
      <rect x="10" y="10" width="260" height="100" fill="#3D2914" rx="5"/>
      <text x="140" y="65" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">[Libro che si chiude]</text>
      <text x="140" y="135" font-family="Georgia, serif" font-size="14" fill="#E8DCC8" text-anchor="middle" font-weight="bold">09_chiusura_transizione</text>
      <text x="140" y="160" font-family="Georgia, serif" font-size="11" fill="#DAA520" text-anchor="middle">Animazione ~0.3s</text>
    </g>

    <!-- Freccia ritorno -->
    <path d="M1100,120 Q1200,120 1200,50 Q1200,-100 960,-150" fill="none" stroke="#5C4033" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="1220" y="50" font-family="Georgia, serif" font-size="12" fill="#5C4033">Ritorno al gameplay</text>
  </g>

  <!-- ========== LEGENDA ========== -->
  <g transform="translate(1450, 900)">
    <rect x="0" y="0" width="400" height="280" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="10"/>
    <text x="200" y="35" font-family="Georgia, serif" font-size="18" fill="#DAA520" text-anchor="middle" font-weight="bold">LEGENDA</text>
    <line x1="20" y1="50" x2="380" y2="50" stroke="#5C4033" stroke-width="1"/>

    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="30" height="20" fill="#2a1f14" stroke="#DAA520" stroke-width="3" rx="3"/>
      <text x="45" y="15" font-family="Georgia, serif" font-size="13" fill="#E8DCC8">Stato default/attivo</text>
    </g>
    <g transform="translate(20, 105)">
      <rect x="0" y="0" width="30" height="20" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="3"/>
      <text x="45" y="15" font-family="Georgia, serif" font-size="13" fill="#E8DCC8">Stato navigabile</text>
    </g>
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="30" height="20" fill="#2a1f14" stroke="#8B0000" stroke-width="2" rx="3"/>
      <text x="45" y="15" font-family="Georgia, serif" font-size="13" fill="#E8DCC8">Stato con notifica/bloccato</text>
    </g>
    <g transform="translate(20, 175)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#DAA520" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="45" y="15" font-family="Georgia, serif" font-size="13" fill="#E8DCC8">Flusso principale</text>
    </g>
    <g transform="translate(20, 210)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#5C4033" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="45" y="15" font-family="Georgia, serif" font-size="13" fill="#E8DCC8">Flusso secondario</text>
    </g>
    <g transform="translate(20, 245)">
      <circle cx="15" cy="10" r="10" fill="#8B0000"/>
      <text x="45" y="15" font-family="Georgia, serif" font-size="13" fill="#E8DCC8">Badge notifica</text>
    </g>
  </g>

  <!-- ========== INFO FILE ========== -->
  <g transform="translate(1450, 1200)">
    <rect x="0" y="0" width="400" height="150" fill="#2a1f14" stroke="#5C4033" stroke-width="2" rx="10"/>
    <text x="200" y="30" font-family="Georgia, serif" font-size="16" fill="#DAA520" text-anchor="middle" font-weight="bold">FILE NELLA CARTELLA</text>
    <text font-family="Georgia, serif" font-size="12" fill="#C4B598">
      <tspan x="20" y="55">00-02: Stati pulsante (chiuso, hover, notifica)</tspan>
      <tspan x="20" y="75">03, 09: Transizioni apertura/chiusura</tspan>
      <tspan x="20" y="95">04-08: Tab contenuto (storia, galleria, ecc.)</tspan>
      <tspan x="20" y="115">10-11: Navigazione capitoli</tspan>
      <tspan x="20" y="135">12: Questa mappa flusso</tspan>
    </text>
  </g>

</svg>