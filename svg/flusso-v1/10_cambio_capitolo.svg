<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="parchmentTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#E8DCC8"/>
    </pattern>
    <linearGradient id="leatherGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D2914"/>
      <stop offset="50%" style="stop-color:#5C4033"/>
      <stop offset="100%" style="stop-color:#3D2914"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <g id="diaryOpen" filter="url(#dropShadow)">
    <rect x="160" y="60" width="1600" height="960" fill="url(#leatherGradient)" rx="15"/>
    <rect x="945" y="60" width="30" height="960" fill="#2a1f14"/>

    <!-- ========== PAGINA SINISTRA - CAPITOLO II ========== -->
    <rect x="180" y="80" width="760" height="900" fill="url(#parchmentTexture)" rx="5"/>
    <rect x="200" y="100" width="720" height="860" fill="none" stroke="#8B7355" stroke-width="2"/>

    <!-- Header CAPITOLO II -->
    <text x="560" y="150" font-family="Georgia, serif" font-size="32" fill="#3D2914" text-anchor="middle" font-weight="bold">CAPITOLO II</text>
    <text x="560" y="185" font-family="Georgia, serif" font-size="20" fill="#5C4033" text-anchor="middle" font-style="italic">Il Viaggio verso Atene</text>
    <line x1="350" y1="200" x2="770" y2="200" stroke="#8B7355" stroke-width="1"/>

    <!-- Immagine diversa (Capitolo II) -->
    <rect x="240" y="230" width="640" height="450" fill="#1C3A3A" stroke="#5C4033" stroke-width="4"/>
    <rect x="250" y="240" width="620" height="430" fill="#0f1f1f"/>
    <text x="560" y="420" font-family="Georgia, serif" font-size="24" fill="#3D5050" text-anchor="middle">[MOTION COMIC]</text>
    <text x="560" y="460" font-family="Georgia, serif" font-size="16" fill="#2D4545" text-anchor="middle">"Il porto di partenza"</text>

    <!-- Controlli -->
    <g transform="translate(240, 700)">
      <g style="cursor: pointer;">
        <circle cx="30" cy="25" r="22" fill="#3D2914" stroke="#8B7355" stroke-width="2"/>
        <path d="M35,15 L22,25 L35,35" fill="none" stroke="#DAA520" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="320" y="32" font-family="Georgia, serif" font-size="16" fill="#5C4033" text-anchor="middle">Immagine 1 di 3</text>
      <g transform="translate(250, 50)">
        <circle cx="0" cy="0" r="8" fill="#DAA520" stroke="#B8860B" stroke-width="2"/>
        <circle cx="20" cy="0" r="6" fill="#8B7355"/>
        <circle cx="40" cy="0" r="6" fill="#8B7355"/>
      </g>
      <g transform="translate(580, 0)" style="cursor: pointer;">
        <circle cx="30" cy="25" r="22" fill="#3D2914" stroke="#8B7355" stroke-width="2"/>
        <path d="M25,15 L38,25 L25,35" fill="none" stroke="#DAA520" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Didascalia -->
    <rect x="240" y="800" width="640" height="80" fill="#D4C5A9" stroke="#8B7355" stroke-width="1"/>
    <text x="560" y="835" font-family="Georgia, serif" font-size="15" fill="#3D2914" text-anchor="middle" font-style="italic">"Il viaggio cominciò sotto auspici inquietanti.</text>
    <text x="560" y="860" font-family="Georgia, serif" font-size="15" fill="#3D2914" text-anchor="middle" font-style="italic">Le nuvole si addensavano all'orizzonte..."</text>

    <!-- Angoli -->
    <path d="M200,100 L240,100 L200,140 Z" fill="#8B7355"/>
    <path d="M920,100 L880,100 L920,140 Z" fill="#8B7355"/>
    <path d="M200,960 L240,960 L200,920 Z" fill="#8B7355"/>
    <path d="M920,960 L880,960 L920,920 Z" fill="#8B7355"/>

    <!-- ========== PAGINA DESTRA ========== -->
    <rect x="980" y="80" width="760" height="900" fill="url(#parchmentTexture)" rx="5"/>
    <rect x="1000" y="100" width="720" height="860" fill="none" stroke="#8B7355" stroke-width="2"/>

    <!-- TAB SEZIONI -->
    <g id="sectionTabs" transform="translate(1020, 120)">
      <g><rect x="0" y="0" width="120" height="40" fill="#5C4033" stroke="#DAA520" stroke-width="2" rx="5"/><text x="60" y="27" font-family="Georgia, serif" font-size="13" fill="#E8DCC8" text-anchor="middle" font-weight="bold">STORIA</text></g>
      <g transform="translate(130, 0)"><rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/><text x="60" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">GALLERIA</text></g>
      <g transform="translate(260, 0)"><rect x="0" y="0" width="130" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/><text x="65" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">PERSONAGGI</text></g>
      <g transform="translate(400, 0)"><rect x="0" y="0" width="100" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/><text x="50" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">LUOGHI</text></g>
      <g transform="translate(510, 0)"><rect x="0" y="0" width="100" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/><text x="50" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">INDIZI</text></g>
    </g>

    <line x1="1020" y1="175" x2="1700" y2="175" stroke="#8B7355" stroke-width="1"/>

    <!-- Contenuto testo CAPITOLO II -->
    <g transform="translate(1030, 190)">
      <text x="330" y="30" font-family="Georgia, serif" font-size="22" fill="#3D2914" text-anchor="middle" font-weight="bold">La Partenza</text>
      <line x1="200" y1="45" x2="460" y2="45" stroke="#C4B598" stroke-width="1"/>

      <text font-family="Georgia, serif" font-size="16" fill="#3D2914">
        <tspan x="20" y="80">Canus mi raggiunse al porto con notizie</tspan>
        <tspan x="20" dy="28">inquietanti. L'imperatore Giustiniano aveva</tspan>
        <tspan x="20" dy="28">emanato un editto che metteva fuorilegge</tspan>
        <tspan x="20" dy="28">le nostre ricerche sui culti proibiti.</tspan>
        <tspan x="20" dy="40" font-style="italic" fill="#5C4033">"Dobbiamo essere più cauti," sussurrò,</tspan>
        <tspan x="20" dy="28" font-style="italic" fill="#5C4033">"ci sono occhi ovunque."</tspan>
        <tspan x="20" dy="40">Ma la notizia che mia madre era gravemente</tspan>
        <tspan x="20" dy="28">malata mi costrinse ad abbandonare le</tspan>
        <tspan x="20" dy="28">ricerche e tornare nella mia terra natale.</tspan>
        <tspan x="20" dy="28">Non potevo sapere che quel viaggio avrebbe</tspan>
        <tspan x="20" dy="28">cambiato tutto per sempre...</tspan>
      </text>

      <rect x="650" y="70" width="8" height="500" fill="#D4C5A9" rx="4"/>
      <rect x="650" y="70" width="8" height="150" fill="#8B7355" rx="4"/>
    </g>

    <!-- Navigazione -->
    <g transform="translate(1020, 880)">
      <g style="cursor: pointer;">
        <rect x="0" y="0" width="140" height="45" fill="#3D2914" stroke="#8B7355" stroke-width="2" rx="5"/>
        <path d="M30,22 L45,12 L45,32 Z" fill="#DAA520"/>
        <text x="90" y="28" font-family="Georgia, serif" font-size="12" fill="#DAA520">PREC</text>
      </g>
      <text x="340" y="30" font-family="Georgia, serif" font-size="14" fill="#5C4033" text-anchor="middle">Sezione 1 di 4</text>
      <g transform="translate(520, 0)" style="cursor: pointer;">
        <rect x="0" y="0" width="140" height="45" fill="#3D2914" stroke="#8B7355" stroke-width="2" rx="5"/>
        <text x="50" y="28" font-family="Georgia, serif" font-size="12" fill="#DAA520">SUCC</text>
        <path d="M115,22 L100,12 L100,32 Z" fill="#DAA520"/>
      </g>
    </g>

    <!-- Angoli -->
    <path d="M1000,100 L1040,100 L1000,140 Z" fill="#8B7355"/>
    <path d="M1720,100 L1680,100 L1720,140 Z" fill="#8B7355"/>
    <path d="M1000,960 L1040,960 L1000,920 Z" fill="#8B7355"/>
    <path d="M1720,960 L1680,960 L1720,920 Z" fill="#8B7355"/>

    <!-- ========== TAB CAPITOLI (II ATTIVO) ========== -->
    <g id="chapterTabs">
      <!-- Tab I -->
      <g transform="translate(130, 180)" style="cursor: pointer;">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#5C4033" stroke="#8B7355" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">I</text>
        <circle cx="-25" cy="52" r="6" fill="#228B22"/>
      </g>
      <!-- Tab II (ATTIVO) -->
      <g transform="translate(130, 260)" style="cursor: pointer;">
        <path d="M0,0 L-60,10 L-60,55 L0,65 Z" fill="#8B7355" stroke="#DAA520" stroke-width="3"/>
        <text x="-38" y="40" font-family="Georgia, serif" font-size="18" fill="#E8DCC8" font-weight="bold">II</text>
        <circle cx="-30" cy="52" r="8" fill="#228B22"/>
      </g>
      <!-- Tab III -->
      <g transform="translate(130, 340)" style="cursor: pointer;">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#5C4033" stroke="#8B7355" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">III</text>
        <circle cx="-25" cy="52" r="6" fill="#DAA520"/>
      </g>
      <!-- Tab IV (bloccato) -->
      <g transform="translate(130, 420)" style="cursor: pointer;" opacity="0.5">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold">IV</text>
        <rect x="-35" y="48" width="12" height="9" fill="none" stroke="#5C4033" stroke-width="1.5"/>
      </g>
      <!-- Tab V (bloccato) -->
      <g transform="translate(130, 500)" style="cursor: pointer;" opacity="0.5">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold">V</text>
        <rect x="-35" y="48" width="12" height="9" fill="none" stroke="#5C4033" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Chiusura -->
    <g transform="translate(1720, 90)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="25" fill="#8B0000" stroke="#DAA520" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Label -->
  <rect x="20" y="1030" width="580" height="30" fill="#000" opacity="0.7" rx="5"/>
  <text x="40" y="1052" font-family="Arial, sans-serif" font-size="14" fill="#DAA520">STATO: Cambio capitolo - CAPITOLO II selezionato (navigazione laterale)</text>

</svg>