<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="parchmentTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#E8DCC8"/>
      <circle cx="20" cy="30" r="1" fill="#D4C5A9" opacity="0.5"/>
      <circle cx="60" cy="70" r="1.5" fill="#C4B598" opacity="0.4"/>
      <circle cx="80" cy="20" r="1" fill="#D4C5A9" opacity="0.3"/>
      <circle cx="40" cy="80" r="1" fill="#C4B598" opacity="0.3"/>
    </pattern>
    <linearGradient id="leatherGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D2914"/>
      <stop offset="50%" style="stop-color:#5C4033"/>
      <stop offset="100%" style="stop-color:#3D2914"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ========== SFONDO OSCURATO ========== -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>
  <rect width="1920" height="1080" fill="#1a1a1a" opacity="0.2"/>

  <!-- ========== DIARIO APERTO ========== -->
  <g id="diaryOpen" filter="url(#dropShadow)">

    <!-- Copertina esterna libro -->
    <rect x="160" y="60" width="1600" height="960" fill="url(#leatherGradient)" rx="15"/>

    <!-- Rilegatura centrale -->
    <rect x="945" y="60" width="30" height="960" fill="#2a1f14"/>
    <line x1="952" y1="80" x2="952" y2="1000" stroke="#1a1208" stroke-width="2"/>
    <line x1="968" y1="80" x2="968" y2="1000" stroke="#1a1208" stroke-width="2"/>
    <!-- Cuciture -->
    <g stroke="#8B7355" stroke-width="1" stroke-dasharray="10,5">
      <line x1="960" y1="100" x2="960" y2="200"/>
      <line x1="960" y1="250" x2="960" y2="350"/>
      <line x1="960" y1="400" x2="960" y2="500"/>
      <line x1="960" y1="550" x2="960" y2="650"/>
      <line x1="960" y1="700" x2="960" y2="800"/>
      <line x1="960" y1="850" x2="960" y2="950"/>
    </g>

    <!-- ========== PAGINA SINISTRA (MOTION COMIC) ========== -->
    <rect x="180" y="80" width="760" height="900" fill="url(#parchmentTexture)" rx="5"/>

    <!-- Cornice decorativa -->
    <rect x="200" y="100" width="720" height="860" fill="none" stroke="#8B7355" stroke-width="2"/>
    <rect x="210" y="110" width="700" height="840" fill="none" stroke="#C4B598" stroke-width="1"/>

    <!-- Header capitolo -->
    <text x="560" y="150" font-family="Georgia, serif" font-size="32" fill="#3D2914" text-anchor="middle" font-weight="bold">CAPITOLO III</text>
    <text x="560" y="185" font-family="Georgia, serif" font-size="20" fill="#5C4033" text-anchor="middle" font-style="italic">La Biblioteca di Atene</text>
    <line x1="350" y1="200" x2="770" y2="200" stroke="#8B7355" stroke-width="1"/>

    <!-- Area immagine motion comic -->
    <rect x="240" y="230" width="640" height="450" fill="#1C3A3A" stroke="#5C4033" stroke-width="4"/>

    <!-- Placeholder immagine con dettagli -->
    <rect x="250" y="240" width="620" height="430" fill="#0f1f1f"/>
    <text x="560" y="420" font-family="Georgia, serif" font-size="24" fill="#3D5050" text-anchor="middle">[MOTION COMIC]</text>
    <text x="560" y="460" font-family="Georgia, serif" font-size="16" fill="#2D4545" text-anchor="middle">"La macchina che non dovrebbe esistere"</text>

    <!-- Icona play (per motion comic animato) -->
    <g transform="translate(560, 500)">
      <circle cx="0" cy="0" r="30" fill="#3D2914" stroke="#DAA520" stroke-width="2" opacity="0.8"/>
      <path d="M-8,-15 L15,0 L-8,15 Z" fill="#DAA520"/>
    </g>

    <!-- Controlli immagine -->
    <g transform="translate(240, 700)">
      <!-- Prev -->
      <g style="cursor: pointer;">
        <circle cx="30" cy="25" r="22" fill="#3D2914" stroke="#8B7355" stroke-width="2"/>
        <path d="M35,15 L22,25 L35,35" fill="none" stroke="#DAA520" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- Indicatore -->
      <text x="320" y="32" font-family="Georgia, serif" font-size="16" fill="#5C4033" text-anchor="middle">Immagine 2 di 4</text>
      <!-- Punti -->
      <g transform="translate(250, 50)">
        <circle cx="0" cy="0" r="6" fill="#8B7355"/>
        <circle cx="20" cy="0" r="8" fill="#DAA520" stroke="#B8860B" stroke-width="2"/>
        <circle cx="40" cy="0" r="6" fill="#8B7355"/>
        <circle cx="60" cy="0" r="6" fill="#8B7355"/>
      </g>
      <!-- Next -->
      <g transform="translate(580, 0)" style="cursor: pointer;">
        <circle cx="30" cy="25" r="22" fill="#3D2914" stroke="#8B7355" stroke-width="2"/>
        <path d="M25,15 L38,25 L25,35" fill="none" stroke="#DAA520" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Didascalia immagine -->
    <rect x="240" y="800" width="640" height="80" fill="#D4C5A9" stroke="#8B7355" stroke-width="1"/>
    <text x="560" y="835" font-family="Georgia, serif" font-size="15" fill="#3D2914" text-anchor="middle" font-style="italic">"Nelle profondità della biblioteca, Rabian scoprì un congegno</text>
    <text x="560" y="860" font-family="Georgia, serif" font-size="15" fill="#3D2914" text-anchor="middle" font-style="italic">che sfidava ogni comprensione umana..."</text>

    <!-- Decorazione angoli pagina sinistra -->
    <path d="M200,100 L240,100 L200,140 Z" fill="#8B7355"/>
    <path d="M920,100 L880,100 L920,140 Z" fill="#8B7355"/>
    <path d="M200,960 L240,960 L200,920 Z" fill="#8B7355"/>
    <path d="M920,960 L880,960 L920,920 Z" fill="#8B7355"/>

    <!-- ========== PAGINA DESTRA (TESTO NARRATIVO) ========== -->
    <rect x="980" y="80" width="760" height="900" fill="url(#parchmentTexture)" rx="5"/>

    <!-- Cornice decorativa -->
    <rect x="1000" y="100" width="720" height="860" fill="none" stroke="#8B7355" stroke-width="2"/>
    <rect x="1010" y="110" width="700" height="840" fill="none" stroke="#C4B598" stroke-width="1"/>

    <!-- TAB SEZIONI -->
    <g id="sectionTabs" transform="translate(1020, 120)">
      <!-- Tab Storia (ATTIVO) -->
      <g>
        <rect x="0" y="0" width="120" height="40" fill="#5C4033" stroke="#DAA520" stroke-width="2" rx="5"/>
        <text x="60" y="27" font-family="Georgia, serif" font-size="13" fill="#E8DCC8" text-anchor="middle" font-weight="bold">STORIA</text>
      </g>
      <!-- Tab Galleria -->
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="60" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">GALLERIA</text>
      </g>
      <!-- Tab Personaggi -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="130" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="65" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">PERSONAGGI</text>
      </g>
      <!-- Tab Luoghi -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="100" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="50" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">LUOGHI</text>
      </g>
      <!-- Tab Indizi -->
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="100" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="50" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">INDIZI</text>
        <!-- Badge nuovo -->
        <circle cx="90" cy="10" r="10" fill="#8B0000"/>
        <text x="90" y="14" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
      </g>
    </g>

    <!-- Separatore -->
    <line x1="1020" y1="175" x2="1700" y2="175" stroke="#8B7355" stroke-width="1"/>

    <!-- Contenuto testo narrativo -->
    <g transform="translate(1030, 190)">
      <!-- Titolo sezione -->
      <text x="330" y="30" font-family="Georgia, serif" font-size="22" fill="#3D2914" text-anchor="middle" font-weight="bold">La Scoperta</text>
      <line x1="200" y1="45" x2="460" y2="45" stroke="#C4B598" stroke-width="1"/>

      <!-- Testo narrativo -->
      <text font-family="Georgia, serif" font-size="16" fill="#3D2914" line-height="1.6">
        <tspan x="20" y="80">Il viaggio verso Atene fu lungo e pieno di presagi</tspan>
        <tspan x="20" dy="28">inquietanti. Durante la traversata, i marinai</tspan>
        <tspan x="20" dy="28">parlavano sottovoce di strane luci viste</tspan>
        <tspan x="20" dy="28">all'orizzonte nelle notti senza luna.</tspan>
        <tspan x="20" dy="40" font-style="italic" fill="#5C4033">"Qualcosa non va in questo luogo,"</tspan>
        <tspan x="20" dy="28" font-style="italic" fill="#5C4033">mormorò Canus guardandosi intorno con</tspan>
        <tspan x="20" dy="28" font-style="italic" fill="#5C4033">circospezione.</tspan>
        <tspan x="20" dy="40">Arrivato finalmente alla Grande Biblioteca,</tspan>
        <tspan x="20" dy="28">Rabian fu colpito dalla magnificenza degli</tspan>
        <tspan x="20" dy="28">antichi scaffali. Ma qualcosa non andava.</tspan>
        <tspan x="20" dy="28">I custodi sembravano nervosi, e certi tomi</tspan>
        <tspan x="20" dy="28">erano stati rimossi dalle loro postazioni...</tspan>
        <tspan x="20" dy="40">Fu allora che scoprì la macchina. Un</tspan>
        <tspan x="20" dy="28">congegno che sfidava ogni logica, nascosto</tspan>
        <tspan x="20" dy="28">nelle catacombe sotto la biblioteca stessa.</tspan>
      </text>

      <!-- Scrollbar -->
      <rect x="650" y="70" width="8" height="500" fill="#D4C5A9" rx="4"/>
      <rect x="650" y="70" width="8" height="200" fill="#8B7355" rx="4"/>
    </g>

    <!-- Navigazione sezioni storia -->
    <g transform="translate(1020, 880)">
      <g style="cursor: pointer;">
        <rect x="0" y="0" width="140" height="45" fill="#3D2914" stroke="#8B7355" stroke-width="2" rx="5"/>
        <path d="M30,22 L45,12 L45,32 Z" fill="#DAA520"/>
        <text x="90" y="28" font-family="Georgia, serif" font-size="12" fill="#DAA520">PREC</text>
      </g>

      <text x="340" y="30" font-family="Georgia, serif" font-size="14" fill="#5C4033" text-anchor="middle">Sezione 2 di 5</text>

      <g transform="translate(520, 0)" style="cursor: pointer;">
        <rect x="0" y="0" width="140" height="45" fill="#3D2914" stroke="#8B7355" stroke-width="2" rx="5"/>
        <text x="50" y="28" font-family="Georgia, serif" font-size="12" fill="#DAA520">SUCC</text>
        <path d="M115,22 L100,12 L100,32 Z" fill="#DAA520"/>
      </g>
    </g>

    <!-- Decorazione angoli pagina destra -->
    <path d="M1000,100 L1040,100 L1000,140 Z" fill="#8B7355"/>
    <path d="M1720,100 L1680,100 L1720,140 Z" fill="#8B7355"/>
    <path d="M1000,960 L1040,960 L1000,920 Z" fill="#8B7355"/>
    <path d="M1720,960 L1680,960 L1720,920 Z" fill="#8B7355"/>

    <!-- ========== TAB CAPITOLI (laterale sinistro) ========== -->
    <g id="chapterTabs">
      <text x="100" y="130" font-family="Georgia, serif" font-size="14" fill="#DAA520" text-anchor="middle" transform="rotate(-90, 100, 200)">CAPITOLI</text>

      <!-- Tab I -->
      <g transform="translate(130, 180)" style="cursor: pointer;">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#5C4033" stroke="#8B7355" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">I</text>
        <circle cx="-25" cy="52" r="6" fill="#228B22"/>
      </g>
      <!-- Tab II -->
      <g transform="translate(130, 260)" style="cursor: pointer;">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#5C4033" stroke="#8B7355" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">II</text>
        <circle cx="-25" cy="52" r="6" fill="#228B22"/>
      </g>
      <!-- Tab III (ATTIVO) -->
      <g transform="translate(130, 340)" style="cursor: pointer;">
        <path d="M0,0 L-60,10 L-60,55 L0,65 Z" fill="#8B7355" stroke="#DAA520" stroke-width="3"/>
        <text x="-38" y="40" font-family="Georgia, serif" font-size="18" fill="#E8DCC8" font-weight="bold">III</text>
        <circle cx="-30" cy="52" r="8" fill="#DAA520"/>
      </g>
      <!-- Tab IV (bloccato) -->
      <g transform="translate(130, 420)" style="cursor: pointer;" opacity="0.5">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold">IV</text>
        <!-- Lucchetto -->
        <rect x="-35" y="48" width="12" height="9" fill="none" stroke="#5C4033" stroke-width="1.5"/>
        <path d="M-31,48 L-31,44 Q-29,40 -27,44 L-27,48" fill="none" stroke="#5C4033" stroke-width="1.5"/>
      </g>
      <!-- Tab V (bloccato) -->
      <g transform="translate(130, 500)" style="cursor: pointer;" opacity="0.5">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold">V</text>
        <rect x="-35" y="48" width="12" height="9" fill="none" stroke="#5C4033" stroke-width="1.5"/>
        <path d="M-31,48 L-31,44 Q-29,40 -27,44 L-27,48" fill="none" stroke="#5C4033" stroke-width="1.5"/>
      </g>
    </g>

    <!-- ========== PULSANTE CHIUSURA ========== -->
    <g id="closeButton" transform="translate(1720, 90)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="25" fill="#8B0000" stroke="#DAA520" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
    </g>

  </g>

  <!-- ========== LABEL SCHERMATA ========== -->
  <rect x="20" y="1030" width="500" height="30" fill="#000" opacity="0.7" rx="5"/>
  <text x="40" y="1052" font-family="Arial, sans-serif" font-size="14" fill="#DAA520">STATO: Diario APERTO - Tab STORIA selezionata (default)</text>

</svg>