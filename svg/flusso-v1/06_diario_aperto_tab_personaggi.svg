<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="parchmentTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#E8DCC8"/>
      <circle cx="20" cy="30" r="1" fill="#D4C5A9" opacity="0.5"/>
    </pattern>
    <linearGradient id="leatherGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D2914"/>
      <stop offset="50%" style="stop-color:#5C4033"/>
      <stop offset="100%" style="stop-color:#3D2914"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <g id="diaryOpen" filter="url(#dropShadow)">
    <rect x="160" y="60" width="1600" height="960" fill="url(#leatherGradient)" rx="15"/>
    <rect x="945" y="60" width="30" height="960" fill="#2a1f14"/>

    <!-- ========== PAGINA SINISTRA (PERSONAGGIO SELEZIONATO) ========== -->
    <rect x="180" y="80" width="760" height="900" fill="url(#parchmentTexture)" rx="5"/>
    <rect x="200" y="100" width="720" height="860" fill="none" stroke="#8B7355" stroke-width="2"/>

    <text x="560" y="150" font-family="Georgia, serif" font-size="32" fill="#3D2914" text-anchor="middle" font-weight="bold">CAPITOLO III</text>
    <line x1="350" y1="170" x2="770" y2="170" stroke="#8B7355" stroke-width="1"/>

    <!-- SCHEDA PERSONAGGIO SELEZIONATO -->
    <g transform="translate(230, 200)">
      <!-- Ritratto -->
      <rect x="0" y="0" width="280" height="350" fill="#1C3A3A" stroke="#DAA520" stroke-width="4"/>
      <rect x="10" y="10" width="260" height="330" fill="#0f1f1f"/>
      <text x="140" y="180" font-family="Georgia, serif" font-size="16" fill="#3D5050" text-anchor="middle">[RITRATTO]</text>
      <text x="140" y="210" font-family="Georgia, serif" font-size="14" fill="#2D4545" text-anchor="middle">Canus</text>

      <!-- Info personaggio -->
      <g transform="translate(300, 0)">
        <text x="0" y="30" font-family="Georgia, serif" font-size="28" fill="#3D2914" font-weight="bold">CANUS</text>
        <text x="0" y="55" font-family="Georgia, serif" font-size="14" fill="#8B7355" font-style="italic">Collega e compagno di viaggio</text>

        <line x1="0" y1="70" x2="350" y2="70" stroke="#C4B598" stroke-width="1"/>

        <!-- Relazione -->
        <text x="0" y="100" font-family="Georgia, serif" font-size="14" fill="#5C4033" font-weight="bold">RELAZIONE:</text>
        <g transform="translate(0, 115)">
          <rect x="0" y="0" width="200" height="12" fill="#D4C5A9" stroke="#8B7355" stroke-width="1" rx="6"/>
          <rect x="0" y="0" width="140" height="12" fill="#228B22" rx="6"/>
          <text x="220" y="10" font-family="Georgia, serif" font-size="12" fill="#5C4033">Alleato fidato</text>
        </g>

        <!-- Ruolo -->
        <text x="0" y="160" font-family="Georgia, serif" font-size="14" fill="#5C4033" font-weight="bold">RUOLO:</text>
        <text x="0" y="180" font-family="Georgia, serif" font-size="13" fill="#3D2914">Studioso e ricercatore. Esperto di</text>
        <text x="0" y="198" font-family="Georgia, serif" font-size="13" fill="#3D2914">lingue antiche e testi proibiti.</text>

        <!-- Incontrato -->
        <text x="0" y="235" font-family="Georgia, serif" font-size="14" fill="#5C4033" font-weight="bold">PRIMO INCONTRO:</text>
        <text x="0" y="255" font-family="Georgia, serif" font-size="13" fill="#3D2914">Capitolo I - Biblioteca di Alessandria</text>

        <!-- Stato -->
        <text x="0" y="290" font-family="Georgia, serif" font-size="14" fill="#5C4033" font-weight="bold">STATO ATTUALE:</text>
        <g transform="translate(0, 300)">
          <circle cx="8" cy="8" r="8" fill="#228B22"/>
          <text x="25" y="13" font-family="Georgia, serif" font-size="13" fill="#3D2914">In viaggio con Rabian</text>
        </g>
      </g>
    </g>

    <!-- Descrizione estesa -->
    <rect x="230" y="580" width="660" height="250" fill="#D4C5A9" stroke="#8B7355" stroke-width="1"/>
    <text x="250" y="610" font-family="Georgia, serif" font-size="14" fill="#5C4033" font-weight="bold">BACKGROUND:</text>
    <text font-family="Georgia, serif" font-size="13" fill="#3D2914">
      <tspan x="250" y="640">Canus è un brillante ma moralmente ambiguo collega con</tspan>
      <tspan x="250" dy="20">cui Rabian condivide una storia complicata. La sua</tspan>
      <tspan x="250" dy="20">conoscenza delle lingue morte e dei testi proibiti si è</tspan>
      <tspan x="250" dy="20">rivelata preziosa, ma i suoi veri obiettivi rimangono</tspan>
      <tspan x="250" dy="20">avvolti nel mistero.</tspan>
      <tspan x="250" dy="30" font-style="italic" fill="#5C4033">"Non fidarti mai completamente di chi cerca la</tspan>
      <tspan x="250" dy="20" font-style="italic" fill="#5C4033">conoscenza proibita... nemmeno di me."</tspan>
    </text>

    <!-- Angoli -->
    <path d="M200,100 L240,100 L200,140 Z" fill="#8B7355"/>
    <path d="M920,100 L880,100 L920,140 Z" fill="#8B7355"/>
    <path d="M200,960 L240,960 L200,920 Z" fill="#8B7355"/>
    <path d="M920,960 L880,960 L920,920 Z" fill="#8B7355"/>

    <!-- ========== PAGINA DESTRA (LISTA PERSONAGGI) ========== -->
    <rect x="980" y="80" width="760" height="900" fill="url(#parchmentTexture)" rx="5"/>
    <rect x="1000" y="100" width="720" height="860" fill="none" stroke="#8B7355" stroke-width="2"/>

    <!-- TAB SEZIONI -->
    <g id="sectionTabs" transform="translate(1020, 120)">
      <g>
        <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="60" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">STORIA</text>
      </g>
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="60" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">GALLERIA</text>
      </g>
      <!-- Tab Personaggi (ATTIVO) -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="130" height="40" fill="#5C4033" stroke="#DAA520" stroke-width="2" rx="5"/>
        <text x="65" y="27" font-family="Georgia, serif" font-size="13" fill="#E8DCC8" text-anchor="middle" font-weight="bold">PERSONAGGI</text>
      </g>
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="100" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="50" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">LUOGHI</text>
      </g>
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="100" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="50" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">INDIZI</text>
      </g>
    </g>

    <line x1="1020" y1="175" x2="1700" y2="175" stroke="#8B7355" stroke-width="1"/>

    <text x="1360" y="210" font-family="Georgia, serif" font-size="20" fill="#3D2914" text-anchor="middle" font-weight="bold">Personaggi incontrati</text>

    <!-- LISTA PERSONAGGI -->
    <g transform="translate(1030, 240)">
      <!-- Card Canus (SELEZIONATO) -->
      <g filter="url(#cardShadow)" style="cursor: pointer;">
        <rect x="0" y="0" width="630" height="100" fill="#5C4033" stroke="#DAA520" stroke-width="3" rx="8"/>
        <rect x="10" y="10" width="80" height="80" fill="#1C3A3A"/>
        <text x="50" y="55" font-family="Georgia" font-size="10" fill="#4B6060" text-anchor="middle">[Ritratto]</text>
        <text x="110" y="40" font-family="Georgia, serif" font-size="18" fill="#E8DCC8" font-weight="bold">Canus</text>
        <text x="110" y="60" font-family="Georgia, serif" font-size="12" fill="#C4B598">Collega e compagno di viaggio</text>
        <text x="110" y="80" font-family="Georgia, serif" font-size="11" fill="#8B7355">Cap. I - Alessandria</text>
        <!-- Indicatore relazione -->
        <rect x="480" y="40" width="80" height="20" fill="#228B22" rx="10"/>
        <text x="520" y="55" font-family="Georgia" font-size="10" fill="#fff" text-anchor="middle">ALLEATO</text>
      </g>

      <!-- Card Jaad -->
      <g transform="translate(0, 120)" filter="url(#cardShadow)" style="cursor: pointer;">
        <rect x="0" y="0" width="630" height="100" fill="#3D2914" stroke="#8B7355" stroke-width="2" rx="8"/>
        <rect x="10" y="10" width="80" height="80" fill="#1C3A3A"/>
        <text x="50" y="55" font-family="Georgia" font-size="10" fill="#4B6060" text-anchor="middle">[Ritratto]</text>
        <text x="110" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">Jaad</text>
        <text x="110" y="60" font-family="Georgia, serif" font-size="12" fill="#C4B598">Guida locale testarda</text>
        <text x="110" y="80" font-family="Georgia, serif" font-size="11" fill="#8B7355">Cap. III - Kabar</text>
        <rect x="480" y="40" width="80" height="20" fill="#DAA520" rx="10"/>
        <text x="520" y="55" font-family="Georgia" font-size="10" fill="#3D2914" text-anchor="middle">NEUTRALE</text>
        <!-- Badge nuovo -->
        <circle cx="610" cy="20" r="12" fill="#8B0000"/>
        <text x="610" y="25" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">!</text>
      </g>

      <!-- Card Il Mercante -->
      <g transform="translate(0, 240)" filter="url(#cardShadow)" style="cursor: pointer;">
        <rect x="0" y="0" width="630" height="100" fill="#3D2914" stroke="#8B7355" stroke-width="2" rx="8"/>
        <rect x="10" y="10" width="80" height="80" fill="#1C3A3A"/>
        <text x="50" y="55" font-family="Georgia" font-size="10" fill="#4B6060" text-anchor="middle">[Ritratto]</text>
        <text x="110" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">Il Mercante</text>
        <text x="110" y="60" font-family="Georgia, serif" font-size="12" fill="#C4B598">Figura misteriosa del bazar</text>
        <text x="110" y="80" font-family="Georgia, serif" font-size="11" fill="#8B7355">Cap. III - Bazar di Kabar</text>
        <rect x="480" y="40" width="80" height="20" fill="#8B0000" rx="10"/>
        <text x="520" y="55" font-family="Georgia" font-size="10" fill="#fff" text-anchor="middle">SOSPETTO</text>
      </g>

      <!-- Card bloccato -->
      <g transform="translate(0, 360)" style="cursor: pointer;" opacity="0.5">
        <rect x="0" y="0" width="630" height="100" fill="#2a1f14" stroke="#3D2914" stroke-width="2" rx="8"/>
        <rect x="10" y="10" width="80" height="80" fill="#1a1208"/>
        <text x="50" y="55" font-family="Georgia" font-size="20" fill="#3D2914" text-anchor="middle">?</text>
        <text x="110" y="40" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold">???</text>
        <text x="110" y="60" font-family="Georgia, serif" font-size="12" fill="#3D2914">Personaggio non ancora incontrato</text>
        <rect x="560" y="35" width="40" height="30" fill="none" stroke="#5C4033" stroke-width="2" rx="5"/>
        <path d="M572,35 L572,28 Q580,18 588,28 L588,35" fill="none" stroke="#5C4033" stroke-width="2"/>
      </g>
    </g>

    <!-- Contatore -->
    <text x="1360" y="750" font-family="Georgia, serif" font-size="14" fill="#5C4033" text-anchor="middle">3 personaggi incontrati in questo capitolo</text>

    <!-- Angoli -->
    <path d="M1000,100 L1040,100 L1000,140 Z" fill="#8B7355"/>
    <path d="M1720,100 L1680,100 L1720,140 Z" fill="#8B7355"/>
    <path d="M1000,960 L1040,960 L1000,920 Z" fill="#8B7355"/>
    <path d="M1720,960 L1680,960 L1720,920 Z" fill="#8B7355"/>

    <!-- Tab capitoli -->
    <g id="chapterTabs">
      <g transform="translate(130, 180)"><path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#5C4033" stroke="#8B7355" stroke-width="1"/><text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">I</text></g>
      <g transform="translate(130, 260)"><path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#5C4033" stroke="#8B7355" stroke-width="1"/><text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">II</text></g>
      <g transform="translate(130, 340)"><path d="M0,0 L-60,10 L-60,55 L0,65 Z" fill="#8B7355" stroke="#DAA520" stroke-width="3"/><text x="-38" y="40" font-family="Georgia, serif" font-size="18" fill="#E8DCC8" font-weight="bold">III</text></g>
      <g transform="translate(130, 420)" opacity="0.5"><path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/><text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold">IV</text></g>
      <g transform="translate(130, 500)" opacity="0.5"><path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/><text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold">V</text></g>
    </g>

    <!-- Pulsante chiusura -->
    <g id="closeButton" transform="translate(1720, 90)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="25" fill="#8B0000" stroke="#DAA520" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="20" y="1030" width="580" height="30" fill="#000" opacity="0.7" rx="5"/>
  <text x="40" y="1052" font-family="Arial, sans-serif" font-size="14" fill="#DAA520">STATO: Diario APERTO - Tab PERSONAGGI - Scheda dettaglio + lista</text>

</svg>