<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="leatherGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D2914"/>
      <stop offset="50%" style="stop-color:#5C4033"/>
      <stop offset="100%" style="stop-color:#3D2914"/>
    </linearGradient>
    <filter id="bookShadow">
      <feDropShadow dx="0" dy="15" stdDeviation="30" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Sfondo che si schiarisce -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>
  <rect width="1920" height="1080" fill="#1a1a1a" opacity="0.4"/>

  <!-- Barra UI che riappare -->
  <rect x="0" y="0" width="1920" height="70" fill="#2a1f14" opacity="0.7"/>

  <!-- LIBRO IN CHIUSURA -->
  <g id="bookClosing" transform="translate(960, 540)" filter="url(#bookShadow)">
    <!-- Copertina posteriore -->
    <rect x="-350" y="-280" width="700" height="560" fill="url(#leatherGradient)" rx="10"/>
    <rect x="-330" y="-260" width="660" height="520" fill="none" stroke="#8B7355" stroke-width="2"/>

    <!-- Simbolo centrale -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="#DAA520" stroke-width="3"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#B8860B" stroke-width="2"/>
      <path d="M0,-40 L0,40 M-35,-20 L35,20 M-35,20 L35,-20" fill="none" stroke="#DAA520" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="#3D2914" stroke="#DAA520" stroke-width="2"/>
    </g>

    <!-- Titolo -->
    <text x="0" y="-180" font-family="Georgia, serif" font-size="24" fill="#DAA520" text-anchor="middle" font-weight="bold">DIARIO DI RABIAN</text>
    <text x="0" y="-150" font-family="Georgia, serif" font-size="14" fill="#8B7355" text-anchor="middle" font-style="italic">Cronache di Innsmouth</text>

    <!-- Angoli decorativi -->
    <path d="M-330,-260 L-290,-260 L-330,-220 Z" fill="#DAA520"/>
    <path d="M330,-260 L290,-260 L330,-220 Z" fill="#DAA520"/>
    <path d="M-330,260 L-290,260 L-330,220 Z" fill="#DAA520"/>
    <path d="M330,260 L290,260 L330,220 Z" fill="#DAA520"/>

    <!-- Pagine che si vedono appena -->
    <rect x="-345" y="-275" width="690" height="550" fill="#E8DCC8" rx="8" opacity="0.2"/>

    <!-- Copertina anteriore quasi chiusa -->
    <g transform="skewY(3) translate(-100, 0)">
      <rect x="-250" y="-280" width="350" height="560" fill="url(#leatherGradient)" rx="10"/>
      <rect x="-230" y="-260" width="310" height="520" fill="none" stroke="#8B7355" stroke-width="2"/>
      <!-- Mezzo simbolo -->
      <g transform="translate(-75, 0)">
        <path d="M0,-40 L0,40" fill="none" stroke="#DAA520" stroke-width="2"/>
        <path d="M0,0 L35,-20 M0,0 L35,20" fill="none" stroke="#DAA520" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- Indicatore -->
  <g transform="translate(960, 900)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="18" fill="#DAA520" text-anchor="middle">Chiusura diario...</text>

    <!-- Barra progresso inversa -->
    <rect x="-100" y="20" width="200" height="8" fill="#2a1f14" stroke="#5C4033" stroke-width="1" rx="4"/>
    <rect x="-100" y="20" width="60" height="8" fill="#DAA520" rx="4"/>
  </g>

  <!-- Label -->
  <rect x="20" y="1030" width="500" height="30" fill="#000" opacity="0.7" rx="5"/>
  <text x="40" y="1052" font-family="Arial, sans-serif" font-size="14" fill="#DAA520">STATO: Transizione chiusura diario (animazione ~0.3s)</text>

</svg>