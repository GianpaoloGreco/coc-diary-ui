<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E8D9B0"/>
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#A0522D"/>
    </linearGradient>
  </defs>

  <!-- ========== SFONDO GIOCO (Kabar - città deserto) ========== -->
  <!-- Cielo -->
  <rect width="1920" height="600" fill="url(#skyGradient)"/>

  <!-- Sole -->
  <circle cx="1600" cy="150" r="80" fill="#FFD700" opacity="0.8"/>

  <!-- Edifici stilizzati Oman -->
  <rect x="100" y="300" width="200" height="400" fill="#E8D9B0" stroke="#C4A574" stroke-width="2"/>
  <rect x="120" y="350" width="40" height="60" fill="#3D2914"/>
  <rect x="180" y="380" width="30" height="40" fill="#3D2914"/>
  <rect x="240" y="320" width="40" height="80" fill="#3D2914"/>

  <rect x="350" y="250" width="180" height="450" fill="#D4C5A9" stroke="#B8A88A" stroke-width="2"/>
  <path d="M350,250 L440,180 L530,250" fill="#C4A574"/>
  <rect x="380" y="320" width="50" height="80" fill="#3D2914"/>
  <rect x="450" y="350" width="40" height="50" fill="#3D2914"/>

  <rect x="580" y="350" width="250" height="350" fill="#E8DCC8" stroke="#C4B598" stroke-width="2"/>
  <rect x="620" y="400" width="60" height="100" fill="#5C4033"/>
  <rect x="720" y="420" width="40" height="60" fill="#3D2914"/>
  <rect x="780" y="380" width="30" height="80" fill="#3D2914"/>

  <!-- Edificio principale (Biblioteca?) -->
  <rect x="900" y="200" width="400" height="500" fill="#D4C5A9" stroke="#8B7355" stroke-width="3"/>
  <rect x="920" y="220" width="360" height="40" fill="#B8A88A"/>
  <rect x="1000" y="280" width="200" height="300" fill="#5C4033"/>
  <rect x="1020" y="300" width="160" height="260" fill="#1a1208"/>
  <text x="1100" y="450" font-family="Georgia, serif" font-size="14" fill="#8B7355" text-anchor="middle">INGRESSO</text>

  <!-- Colonne -->
  <rect x="940" y="280" width="30" height="320" fill="#C4B598"/>
  <rect x="1230" y="280" width="30" height="320" fill="#C4B598"/>

  <!-- Altri edifici -->
  <rect x="1350" y="320" width="200" height="380" fill="#E8D9B0" stroke="#C4A574" stroke-width="2"/>
  <rect x="1380" y="380" width="50" height="70" fill="#3D2914"/>
  <rect x="1460" y="400" width="40" height="50" fill="#3D2914"/>

  <rect x="1600" y="280" width="280" height="420" fill="#D4C5A9" stroke="#B8A88A" stroke-width="2"/>
  <rect x="1650" y="350" width="60" height="90" fill="#3D2914"/>
  <rect x="1750" y="380" width="50" height="60" fill="#3D2914"/>

  <!-- Terreno -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#groundGradient)"/>

  <!-- Dettagli terreno -->
  <ellipse cx="300" cy="750" rx="100" ry="20" fill="#C4A060" opacity="0.5"/>
  <ellipse cx="800" cy="780" rx="150" ry="25" fill="#C4A060" opacity="0.4"/>
  <ellipse cx="1400" cy="740" rx="120" ry="18" fill="#C4A060" opacity="0.5"/>

  <!-- Personaggio Rabian (pixel art style placeholder) -->
  <g transform="translate(960, 650)">
    <!-- Corpo -->
    <rect x="-15" y="0" width="30" height="50" fill="#8B4513"/>
    <!-- Testa -->
    <rect x="-12" y="-25" width="24" height="25" fill="#DEB887"/>
    <!-- Capelli -->
    <rect x="-12" y="-30" width="24" height="10" fill="#3D2914"/>
    <!-- Turbante/copricapo -->
    <rect x="-14" y="-32" width="28" height="8" fill="#E8DCC8"/>
  </g>

  <!-- ========== BARRA UI SUPERIORE ========== -->
  <rect x="0" y="0" width="1920" height="70" fill="#2a1f14" stroke="#5C4033" stroke-width="2"/>

  <!-- Inventario slot -->
  <g id="inventory">
    <rect x="20" y="10" width="50" height="50" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="75" y="10" width="50" height="50" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <!-- Oggetto nell'inventario -->
    <rect x="85" y="20" width="30" height="30" fill="#DAA520" rx="2"/>
    <rect x="130" y="10" width="50" height="50" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="185" y="10" width="50" height="50" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="240" y="10" width="50" height="50" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="295" y="10" width="50" height="50" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="350" y="10" width="50" height="50" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="405" y="10" width="50" height="50" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
  </g>

  <!-- Separatore -->
  <line x1="475" y1="10" x2="475" y2="60" stroke="#5C4033" stroke-width="2"/>

  <!-- PULSANTE DIARIO (stato normale) -->
  <g id="diaryButton" transform="translate(495, 10)" style="cursor: pointer;">
    <rect width="120" height="50" fill="#3D2914" stroke="#8B7355" stroke-width="2" rx="5"/>
    <!-- Icona libro -->
    <rect x="15" y="8" width="28" height="34" fill="#E8DCC8" rx="2"/>
    <line x1="29" y1="8" x2="29" y2="42" stroke="#3D2914" stroke-width="3"/>
    <line x1="20" y1="16" x2="38" y2="16" stroke="#8B7355" stroke-width="1"/>
    <line x1="20" y1="22" x2="38" y2="22" stroke="#8B7355" stroke-width="1"/>
    <line x1="20" y1="28" x2="38" y2="28" stroke="#8B7355" stroke-width="1"/>
    <line x1="20" y1="34" x2="38" y2="34" stroke="#8B7355" stroke-width="1"/>
    <text x="78" y="32" font-family="Georgia, serif" font-size="13" fill="#DAA520" font-weight="bold">DIARIO</text>
  </g>

  <!-- Altri pulsanti UI -->
  <g transform="translate(635, 10)">
    <rect width="90" height="50" fill="#2a1f14" stroke="#5C4033" stroke-width="1" rx="5"/>
    <text x="45" y="32" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">MAPPA</text>
  </g>
  <g transform="translate(735, 10)">
    <rect width="90" height="50" fill="#2a1f14" stroke="#5C4033" stroke-width="1" rx="5"/>
    <text x="45" y="32" font-family="Georgia, serif" font-size="12" fill="#8B7355" text-anchor="middle">OPZIONI</text>
  </g>

  <!-- ========== BARRA VERBI (stile LucasArts) ========== -->
  <rect x="0" y="880" width="1920" height="200" fill="#1a1208" stroke="#5C4033" stroke-width="2"/>

  <!-- Griglia verbi -->
  <g id="verbBar" transform="translate(50, 900)">
    <!-- Riga 1 -->
    <g>
      <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="3"/>
      <text x="60" y="27" font-family="'Courier New', monospace" font-size="14" fill="#DAA520" text-anchor="middle">Dai</text>
    </g>
    <g transform="translate(130, 0)">
      <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="3"/>
      <text x="60" y="27" font-family="'Courier New', monospace" font-size="14" fill="#DAA520" text-anchor="middle">Prendi</text>
    </g>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="3"/>
      <text x="60" y="27" font-family="'Courier New', monospace" font-size="14" fill="#DAA520" text-anchor="middle">Usa</text>
    </g>

    <!-- Riga 2 -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="3"/>
      <text x="60" y="27" font-family="'Courier New', monospace" font-size="14" fill="#DAA520" text-anchor="middle">Apri</text>
    </g>
    <g transform="translate(130, 50)">
      <rect x="0" y="0" width="120" height="40" fill="#5C4033" stroke="#DAA520" stroke-width="2" rx="3"/>
      <text x="60" y="27" font-family="'Courier New', monospace" font-size="14" fill="#E8DCC8" text-anchor="middle">Guarda</text>
    </g>
    <g transform="translate(260, 50)">
      <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="3"/>
      <text x="60" y="27" font-family="'Courier New', monospace" font-size="14" fill="#DAA520" text-anchor="middle">Spingi</text>
    </g>

    <!-- Riga 3 -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="3"/>
      <text x="60" y="27" font-family="'Courier New', monospace" font-size="14" fill="#DAA520" text-anchor="middle">Chiudi</text>
    </g>
    <g transform="translate(130, 100)">
      <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="3"/>
      <text x="60" y="27" font-family="'Courier New', monospace" font-size="14" fill="#DAA520" text-anchor="middle">Parla con</text>
    </g>
    <g transform="translate(260, 100)">
      <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="3"/>
      <text x="60" y="27" font-family="'Courier New', monospace" font-size="14" fill="#DAA520" text-anchor="middle">Tira</text>
    </g>
  </g>

  <!-- Azione corrente -->
  <text x="500" y="930" font-family="'Courier New', monospace" font-size="18" fill="#E8DCC8">Guarda ingresso biblioteca</text>

  <!-- Inventario espanso nella barra inferiore -->
  <g transform="translate(800, 900)">
    <rect x="0" y="0" width="70" height="70" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
    <rect x="10" y="10" width="50" height="50" fill="#DAA520" rx="2"/>

    <rect x="80" y="0" width="70" height="70" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>

    <rect x="160" y="0" width="70" height="70" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>

    <rect x="240" y="0" width="70" height="70" fill="#1a1208" stroke="#8B7355" stroke-width="1" rx="3"/>
  </g>

  <!-- ========== INDICATORE STATO ========== -->
  <g transform="translate(1700, 900)">
    <text font-family="Georgia, serif" font-size="14" fill="#8B7355">
      <tspan x="0" y="20">Capitolo III</tspan>
      <tspan x="0" y="40">Kabar - Piazza centrale</tspan>
    </text>
  </g>

  <!-- ========== LABEL SCHERMATA ========== -->
  <rect x="20" y="1030" width="400" height="30" fill="#000" opacity="0.7" rx="5"/>
  <text x="40" y="1052" font-family="Arial, sans-serif" font-size="14" fill="#DAA520">STATO: Diario CHIUSO - Gameplay normale</text>

</svg>