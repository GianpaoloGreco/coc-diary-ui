<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="parchmentTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#E8DCC8"/>
      <circle cx="20" cy="30" r="1" fill="#D4C5A9" opacity="0.5"/>
      <circle cx="60" cy="70" r="1.5" fill="#C4B598" opacity="0.4"/>
    </pattern>
    <linearGradient id="leatherGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D2914"/>
      <stop offset="50%" style="stop-color:#5C4033"/>
      <stop offset="100%" style="stop-color:#3D2914"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="imgShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sfondo -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- ========== DIARIO APERTO ========== -->
  <g id="diaryOpen" filter="url(#dropShadow)">
    <rect x="160" y="60" width="1600" height="960" fill="url(#leatherGradient)" rx="15"/>
    <rect x="945" y="60" width="30" height="960" fill="#2a1f14"/>

    <!-- ========== PAGINA SINISTRA ========== -->
    <rect x="180" y="80" width="760" height="900" fill="url(#parchmentTexture)" rx="5"/>
    <rect x="200" y="100" width="720" height="860" fill="none" stroke="#8B7355" stroke-width="2"/>

    <!-- Header -->
    <text x="560" y="150" font-family="Georgia, serif" font-size="32" fill="#3D2914" text-anchor="middle" font-weight="bold">CAPITOLO III</text>
    <text x="560" y="185" font-family="Georgia, serif" font-size="20" fill="#5C4033" text-anchor="middle" font-style="italic">La Biblioteca di Atene</text>
    <line x1="350" y1="200" x2="770" y2="200" stroke="#8B7355" stroke-width="1"/>

    <!-- IMMAGINE SELEZIONATA (grande) -->
    <rect x="230" y="230" width="660" height="480" fill="#1C3A3A" stroke="#DAA520" stroke-width="4"/>
    <rect x="240" y="240" width="640" height="460" fill="#0f1f1f"/>
    <text x="560" y="450" font-family="Georgia, serif" font-size="20" fill="#3D5050" text-anchor="middle">[MOTION COMIC SELEZIONATO]</text>
    <text x="560" y="490" font-family="Georgia, serif" font-size="14" fill="#2D4545" text-anchor="middle">"Il mercante sospetto"</text>

    <!-- Play button -->
    <g transform="translate(560, 540)">
      <circle cx="0" cy="0" r="35" fill="#3D2914" stroke="#DAA520" stroke-width="2" opacity="0.9"/>
      <path d="M-10,-18 L18,0 L-10,18 Z" fill="#DAA520"/>
    </g>

    <!-- Info immagine -->
    <rect x="230" y="730" width="660" height="100" fill="#D4C5A9" stroke="#8B7355" stroke-width="1"/>
    <text x="250" y="760" font-family="Georgia, serif" font-size="16" fill="#3D2914" font-weight="bold">Il mercante sospetto</text>
    <text x="250" y="785" font-family="Georgia, serif" font-size="13" fill="#5C4033">Scena 2 - Rabian incontra un mercante nel bazar che sembra</text>
    <text x="250" y="805" font-family="Georgia, serif" font-size="13" fill="#5C4033">sapere più di quanto voglia ammettere...</text>

    <!-- Angoli decorativi -->
    <path d="M200,100 L240,100 L200,140 Z" fill="#8B7355"/>
    <path d="M920,100 L880,100 L920,140 Z" fill="#8B7355"/>
    <path d="M200,960 L240,960 L200,920 Z" fill="#8B7355"/>
    <path d="M920,960 L880,960 L920,920 Z" fill="#8B7355"/>

    <!-- ========== PAGINA DESTRA (GALLERIA) ========== -->
    <rect x="980" y="80" width="760" height="900" fill="url(#parchmentTexture)" rx="5"/>
    <rect x="1000" y="100" width="720" height="860" fill="none" stroke="#8B7355" stroke-width="2"/>

    <!-- TAB SEZIONI -->
    <g id="sectionTabs" transform="translate(1020, 120)">
      <!-- Tab Storia -->
      <g>
        <rect x="0" y="0" width="120" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="60" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">STORIA</text>
      </g>
      <!-- Tab Galleria (ATTIVO) -->
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="120" height="40" fill="#5C4033" stroke="#DAA520" stroke-width="2" rx="5"/>
        <text x="60" y="27" font-family="Georgia, serif" font-size="13" fill="#E8DCC8" text-anchor="middle" font-weight="bold">GALLERIA</text>
      </g>
      <!-- Tab Personaggi -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="130" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="65" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">PERSONAGGI</text>
      </g>
      <!-- Tab Luoghi -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="100" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="50" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">LUOGHI</text>
      </g>
      <!-- Tab Indizi -->
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="100" height="40" fill="#3D2914" stroke="#5C4033" stroke-width="1" rx="5"/>
        <text x="50" y="27" font-family="Georgia, serif" font-size="13" fill="#8B7355" text-anchor="middle">INDIZI</text>
        <circle cx="90" cy="10" r="10" fill="#8B0000"/>
        <text x="90" y="14" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
      </g>
    </g>

    <line x1="1020" y1="175" x2="1700" y2="175" stroke="#8B7355" stroke-width="1"/>

    <!-- TITOLO GALLERIA -->
    <text x="1360" y="210" font-family="Georgia, serif" font-size="20" fill="#3D2914" text-anchor="middle" font-weight="bold">Immagini sbloccate</text>

    <!-- GRIGLIA THUMBNAIL -->
    <g transform="translate(1030, 240)">
      <!-- Riga 1 -->
      <!-- Thumb 1 -->
      <g filter="url(#imgShadow)" style="cursor: pointer;">
        <rect x="0" y="0" width="200" height="140" fill="#1C3A3A" stroke="#8B7355" stroke-width="2"/>
        <text x="100" y="75" font-family="Georgia" font-size="12" fill="#4B6060" text-anchor="middle">Scena 1</text>
        <circle cx="180" cy="120" r="10" fill="#228B22"/>
        <text x="180" y="125" font-family="Georgia" font-size="10" fill="#fff" text-anchor="middle">&#10003;</text>
      </g>
      <!-- Thumb 2 (SELEZIONATO) -->
      <g transform="translate(220, 0)" filter="url(#imgShadow)" style="cursor: pointer;">
        <rect x="0" y="0" width="200" height="140" fill="#1C3A3A" stroke="#DAA520" stroke-width="4"/>
        <text x="100" y="75" font-family="Georgia" font-size="12" fill="#4B6060" text-anchor="middle">Scena 2</text>
        <circle cx="180" cy="120" r="10" fill="#DAA520"/>
      </g>
      <!-- Thumb 3 -->
      <g transform="translate(440, 0)" filter="url(#imgShadow)" style="cursor: pointer;">
        <rect x="0" y="0" width="200" height="140" fill="#1C3A3A" stroke="#8B7355" stroke-width="2"/>
        <text x="100" y="75" font-family="Georgia" font-size="12" fill="#4B6060" text-anchor="middle">Scena 3</text>
        <circle cx="180" cy="120" r="10" fill="#228B22"/>
        <text x="180" y="125" font-family="Georgia" font-size="10" fill="#fff" text-anchor="middle">&#10003;</text>
      </g>

      <!-- Riga 2 -->
      <!-- Thumb 4 -->
      <g transform="translate(0, 160)" filter="url(#imgShadow)" style="cursor: pointer;">
        <rect x="0" y="0" width="200" height="140" fill="#1C3A3A" stroke="#8B7355" stroke-width="2"/>
        <text x="100" y="75" font-family="Georgia" font-size="12" fill="#4B6060" text-anchor="middle">Scena 4</text>
        <circle cx="180" cy="120" r="10" fill="#228B22"/>
        <text x="180" y="125" font-family="Georgia" font-size="10" fill="#fff" text-anchor="middle">&#10003;</text>
      </g>
      <!-- Thumb 5 (BLOCCATO) -->
      <g transform="translate(220, 160)" style="cursor: pointer;" opacity="0.5">
        <rect x="0" y="0" width="200" height="140" fill="#2a1f14" stroke="#3D2914" stroke-width="2"/>
        <text x="100" y="65" font-family="Georgia" font-size="12" fill="#5C4033" text-anchor="middle">Scena 5</text>
        <!-- Lucchetto -->
        <rect x="85" y="80" width="30" height="22" fill="none" stroke="#5C4033" stroke-width="2" rx="3"/>
        <path d="M92,80 L92,72 Q100,62 108,72 L108,80" fill="none" stroke="#5C4033" stroke-width="2"/>
      </g>
      <!-- Thumb 6 (BLOCCATO) -->
      <g transform="translate(440, 160)" style="cursor: pointer;" opacity="0.5">
        <rect x="0" y="0" width="200" height="140" fill="#2a1f14" stroke="#3D2914" stroke-width="2"/>
        <text x="100" y="65" font-family="Georgia" font-size="12" fill="#5C4033" text-anchor="middle">Scena 6</text>
        <rect x="85" y="80" width="30" height="22" fill="none" stroke="#5C4033" stroke-width="3" rx="3"/>
        <path d="M92,80 L92,72 Q100,62 108,72 L108,80" fill="none" stroke="#5C4033" stroke-width="2"/>
      </g>

      <!-- Riga 3 -->
      <!-- Thumb 7 (BLOCCATO) -->
      <g transform="translate(0, 320)" style="cursor: pointer;" opacity="0.5">
        <rect x="0" y="0" width="200" height="140" fill="#2a1f14" stroke="#3D2914" stroke-width="2"/>
        <text x="100" y="65" font-family="Georgia" font-size="12" fill="#5C4033" text-anchor="middle">Scena 7</text>
        <rect x="85" y="80" width="30" height="22" fill="none" stroke="#5C4033" stroke-width="2" rx="3"/>
        <path d="M92,80 L92,72 Q100,62 108,72 L108,80" fill="none" stroke="#5C4033" stroke-width="2"/>
      </g>
      <!-- Thumb 8 (BLOCCATO) -->
      <g transform="translate(220, 320)" style="cursor: pointer;" opacity="0.5">
        <rect x="0" y="0" width="200" height="140" fill="#2a1f14" stroke="#3D2914" stroke-width="2"/>
        <text x="100" y="65" font-family="Georgia" font-size="12" fill="#5C4033" text-anchor="middle">Scena 8</text>
        <rect x="85" y="80" width="30" height="22" fill="none" stroke="#5C4033" stroke-width="2" rx="3"/>
        <path d="M92,80 L92,72 Q100,62 108,72 L108,80" fill="none" stroke="#5C4033" stroke-width="2"/>
      </g>
      <!-- Placeholder -->
      <g transform="translate(440, 320)" opacity="0.3">
        <rect x="0" y="0" width="200" height="140" fill="none" stroke="#5C4033" stroke-width="1" stroke-dasharray="5,5"/>
        <text x="100" y="75" font-family="Georgia" font-size="12" fill="#5C4033" text-anchor="middle">...</text>
      </g>
    </g>

    <!-- Contatore -->
    <text x="1360" y="730" font-family="Georgia, serif" font-size="14" fill="#5C4033" text-anchor="middle">4 di 8 immagini sbloccate</text>

    <!-- Barra progresso -->
    <rect x="1130" y="750" width="460" height="12" fill="#D4C5A9" stroke="#8B7355" stroke-width="1" rx="6"/>
    <rect x="1130" y="750" width="230" height="12" fill="#DAA520" rx="6"/>

    <!-- Angoli decorativi -->
    <path d="M1000,100 L1040,100 L1000,140 Z" fill="#8B7355"/>
    <path d="M1720,100 L1680,100 L1720,140 Z" fill="#8B7355"/>
    <path d="M1000,960 L1040,960 L1000,920 Z" fill="#8B7355"/>
    <path d="M1720,960 L1680,960 L1720,920 Z" fill="#8B7355"/>

    <!-- ========== TAB CAPITOLI ========== -->
    <g id="chapterTabs">
      <g transform="translate(130, 180)" style="cursor: pointer;">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#5C4033" stroke="#8B7355" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">I</text>
        <circle cx="-25" cy="52" r="6" fill="#228B22"/>
      </g>
      <g transform="translate(130, 260)" style="cursor: pointer;">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#5C4033" stroke="#8B7355" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#DAA520" font-weight="bold">II</text>
        <circle cx="-25" cy="52" r="6" fill="#228B22"/>
      </g>
      <g transform="translate(130, 340)" style="cursor: pointer;">
        <path d="M0,0 L-60,10 L-60,55 L0,65 Z" fill="#8B7355" stroke="#DAA520" stroke-width="3"/>
        <text x="-38" y="40" font-family="Georgia, serif" font-size="18" fill="#E8DCC8" font-weight="bold">III</text>
        <circle cx="-30" cy="52" r="8" fill="#DAA520"/>
      </g>
      <g transform="translate(130, 420)" style="cursor: pointer;" opacity="0.5">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold">IV</text>
      </g>
      <g transform="translate(130, 500)" style="cursor: pointer;" opacity="0.5">
        <path d="M0,0 L-50,10 L-50,55 L0,65 Z" fill="#3D2914" stroke="#2a1f14" stroke-width="1"/>
        <text x="-32" y="40" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold">V</text>
      </g>
    </g>

    <!-- Pulsante chiusura -->
    <g id="closeButton" transform="translate(1720, 90)" style="cursor: pointer;">
      <circle cx="0" cy="0" r="25" fill="#8B0000" stroke="#DAA520" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#E8DCC8" stroke-width="3" stroke-linecap="round"/>
    </g>

  </g>

  <!-- Label -->
  <rect x="20" y="1030" width="550" height="30" fill="#000" opacity="0.7" rx="5"/>
  <text x="40" y="1052" font-family="Arial, sans-serif" font-size="14" fill="#DAA520">STATO: Diario APERTO - Tab GALLERIA - Griglia thumbnail + anteprima</text>

</svg>